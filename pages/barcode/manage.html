<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>ממשק ניהול</title>
</head>

<body onload="onLoad()">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link href="../../styleSheets/manageStyleSheet.css" rel="stylesheet" />
    <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
    <style>
        .default-task-pick {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.35rem 0;
            font-size: 0.95rem;
        }

        .default-task-pick label {
            margin: 0;
            white-space: nowrap;
        }

        .default-task-pick select {
            max-width: 14rem;
        }
    </style>
    <script src="../../js/ag-grid-community.min.js"></script>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../../js/shared.js"></script>

    <script>
        var systemConfig = "";
        var students = "";
        var tableName
        var searchVal=""
        var currentDate = getTodayDate();
        var gridOptions
        var columnDefs = [
            { headerName: "כיתה", field: "grade", editable: true },
            { headerName: "שם", field: "name", editable: true },
            { headerName: "תעודת זהות", field: "tz", editable: true },
            { headerName: "קוד", field: "code", editable: true },
            { headerName: "סך נקודות", field: "points", editable: true }];

        function onLoad() {
            tableName = 'systemConfig'
            window.expose.sendSystem("sendReadSystem", tableName);
            window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
                systemConfig = data
                document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color);
                document.querySelector(".text").style.color = getTextColor(systemConfig.textColor);
            });
            tableName = 'students'
            window.expose.sendDbData("sendGetDataByTable", tableName);
            window.expose.receiveDbData("receiveGetDataByTable" + tableName, (data) => {
                if (Array.isArray(data) && data.length > 0) {
                    students = data
                    
                    gridOptions = {
                        columnDefs: columnDefs,
                        rowData: students,
                        enableRtl: true,
                        defaultColDef: {
                            filter: 'agTextColumnFilter',
                            filterParams: {
                                suppressAndOrCondition: true
                            },
                            sortable: true,
                            resizable: true,
                        },
                        onFirstDataRendered: onFirstDataRendered,
                        onCellEditingStopped: updateStudent
                    };
                    var gridDiv = document.querySelector('#studentsGrid');
                    new agGrid.Grid(gridDiv, gridOptions);
                }
            });

            // במצב אישי אין טבלת משימות, רק בחירה של משימת ברירת מחדל
            window.expose.receiveDbData("receiveSetDefaultTask", fillDefaultTaskSelect);
            window.expose.sendDbData("sendGetDataByTable", 'tasks');
            window.expose.receiveDbData("receiveGetDataByTable" + 'tasks', fillDefaultTaskSelect);
        }

        function fillDefaultTaskSelect(tasks) {
            if (!Array.isArray(tasks)) {
                return;
            }
            const select = document.getElementById("defaultTask");
            const current = tasks.find(task => Number(task.isDefault) === 1);

            select.innerHTML = '<option value="0">ללא</option>';
            // טריוויה דורשת מסך שאלות ולכן לא יכולה להיות משימת ברירת מחדל
            tasks.filter(task => Number(task.type) !== 2).forEach(task => {
                const option = document.createElement('option');
                option.value = task.id;
                option.textContent = task.name;
                select.appendChild(option);
            });
            select.value = current ? String(current.id) : "0";
        }

        function changeDefaultTask() {
            const id = Number(document.getElementById("defaultTask").value);
            window.expose.sendDbData("sendSetDefaultTask", id);
        }

        document.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                if (searchVal.length > 0) {
                    if (searchVal == '999999999')
                        login("../main/user")
                    if (searchVal == '011429519')
                        login("../main/system")
                }
            } else {
                searchVal += e.key;
            }
        });

        function addStudent() {
            window.expose.sendDbData("sendInsertStudent");
            window.expose.receiveDbData("receiveInsertStudent", (data) => {
                if (data === true) {
                    location.reload();
                }
            });
        }

        function onFirstDataRendered(params) {
            gridOptions.api.sizeColumnsToFit({
                defaultMinWidth: 100,
            });
        }

        function updateStudent(params) {
            const payload = {
                id: params.data.id,
                field: params.colDef.field,
                value: params.newValue
            };
            window.expose.sendDbData("sendUpdateStudent", JSON.stringify(payload));
            window.expose.receiveDbData("receiveUpdateStudent", () => {});
        }

        function exportToExcel(name) {
            var params = {
                fileName: currentDate + ' ' + name,
            };
            gridOptions.api.exportDataAsCsv(params);
        }

    </script>
    <div class="background" id="background">
        <a href="#" class="prizes-open-btn" onclick="login('../main/prizes'); return false;">צ'ופרים</a>
        <div class="closeBtn">
            <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
        </div>
        <div class="text">
            <div id="line1">ברוכים הבאים הבאה לממשק ניהול</div>
            <div id="line2">כאן אפשר לצפות, לערוך ולהוריד את הנתונים</div>
            <div class="default-task-pick">
                <label for="defaultTask">משימת ברירת מחדל:</label>
                <select id="defaultTask" class="form-select form-select-sm"
                    onchange="changeDefaultTask()"></select>
            </div>
            <img style="margin-left: 10px;" onclick="exportToExcel('ניקוד תלמידות')"
                src="../../resources/barcode/download-simple-light.svg" />
            <img style="margin-left: 10px;" onclick="addStudent()" src="../../resources/barcode/plus-light.svg" />
            <div id="studentsGrid" style="width:100%" class="ag-theme-alpine"></div>
        </div>
    </div>
</body>

</html>
