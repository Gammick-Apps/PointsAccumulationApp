<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>תוכנית הברקודים</title>
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/userStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>

  <script>
    var students = ""
    var tasks = ""
    var systemConfig = ""
    var searchVal = ""
    var buffer = "";
    var step
    var currentStudent
    var currentResult
    var tableName
    var prizeWon = null;
    var printStage = "";

    // משך הצגת הפופאפ כשאין מדפסת, מתי נשלח השובר, וכמה נשאר אחרי שיצא
    const PRIZE_DISPLAY_MS = 4500;
    const PRIZE_PRINT_DELAY_MS = 1200;
    const PRIZE_AFTER_PRINT_MS = 2500;

    const Steps = {
      step1: "1",
      step2: "2",
      step3: "3"
    };

    function onLoad() {
      step = Steps.step1;
      updateLines("!...שלום", "יש לתקף את הכרטיס האישי בסורק הברקוד")
      tableName = 'systemConfig'
      window.expose.sendSystem("sendReadSystem", tableName);
      window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
        systemConfig = data
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]

        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step)
        document.querySelector(".text").style.color = getTextColor(systemConfig.textColor);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
        registerPrintHandler();
      })
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          searchVal = buffer;
          buffer = "";
          if (step == Steps.step1) {
            if (searchVal == '999999999')
              login('../main/manage')
            else if (searchVal == '011429519')
              login('../main/system')
            else if (searchVal == '207594581')
              login('../parentsMeeting/user')
            else
              searchStudent();//בת
          }
          else if (step == Steps.step2) {
            systemConfig.buy == 1 ? searchProduct() : searchTask();
          }
        }
      } else {
        buffer += e.key;
      }
    });

    function searchStudent() {
      step = Steps.step2
      hideGraphsButton();
      window.expose.sendDbData("sendGetStudentById", searchVal);
      window.expose.receiveDbData("receiveGetStudentById", (student) => {
        currentStudent = student

        if (currentStudent == null) {
          showAlert("הברקוד לא מופיע ברשימות. גשו למורה!")
          return;
        }
        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step)

        updateLines(
          "(: שלום  " + currentStudent.name,
          systemConfig.buy == 1 ? "יש לסרוק את ברקוד המתנה" : "יש לסרוק את הברקוד לעדכון משימה",
          "עד כה צברת " + currentStudent.points + " נקודות")
      });
    }

    // ההחלטה לפי multiple נעשית בשרת, כך שלכל העמדות יש הגדרה אחת
    function checkDuplicateThenSave(save, messages) {
      window.expose.sendDbData("sendHasStudentDoneSelected", { currentStudent, currentResult });
      window.expose.receiveDbData("receiveHasStudentDoneSelected", (alreadyDone) => {
        if (alreadyDone) {
          showAlert(Number(currentResult.multiple) === 2 ? messages.daily : messages.ever);
          return;
        }
        save();
      });
    }

    const TASK_MESSAGES = {
      ever: "הי, בחירה זו כבר קיימת בחשבונך!",
      daily: "הי, כבר תיקפת את זה היום!"
    };

    const PRODUCT_MESSAGES = {
      ever: "הי, מתנה זו כבר קיימת בחשבונך!",
      daily: "הי, כבר קנית את זה היום!"
    };

    function searchTask() {
      step = Steps.step3;

      window.expose.sendDbData("sendGetTaskByCode", searchVal);
      window.expose.receiveDbData("receiveGetTaskByCode", (task) => {
        if (!task) {
          showAlert("קוד לא תקין, גשו למורה!");
          return;
        }
        currentResult = task
        if (systemConfig.type === 1) {
          window.expose.sendDbData("sendIsTaskUsed", { currentResult });
          window.expose.receiveDbData("receiveIsTaskUsed", (used) => {
            if (used) {
              showAlert("הי, משימה זו כבר תוקפה!");
              return;
            }
            saveStudentData();
          });
        }

        else {
          checkDuplicateThenSave(saveStudentData, TASK_MESSAGES);
        }
      });
    }

    // hasStudentDoneSelected בודק לבד ב-studentsProducts כש-buy == 1
    function searchProduct() {
      step = Steps.step3;

      window.expose.sendDbData("sendGetProductByCode", searchVal);
      window.expose.receiveDbData("receiveGetProductByCode", (product) => {
        if (!product) {
          showAlert("קוד לא תקין, גשו למורה!");
          return;
        }
        currentResult = product;

        checkDuplicateThenSave(saveStudentProduct, PRODUCT_MESSAGES);
      });
    }

    // saveStudentProduct בשרת מחזיר false כשאין מספיק נקודות, לפני שנרשם משהו
    function saveStudentProduct() {
      window.expose.sendDbData("sendSaveStudentProduct", { currentStudent, currentResult });
      window.expose.receiveDbData("receiveSaveStudentData", (points) => {
        if (points === false) {
          showAlert("אין לך מספיק נקודות בחשבון!");
          return;
        }
        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step);
        currentStudent.points = points;
        updateLines(
          "תודה רבה " + currentStudent.name,
          "כעת יש בחשבונך " + currentStudent.points + " נקודות",
          "!בהצלחה");

        if (systemConfig.hasPrint == 1) {
          setTimeout(function () {
            toPrint();
          }, 2000);
        } else {
          reset(2000);
        }
      });
    }

    async function saveStudentData() {
      window.expose.sendDbData("sendSaveStudentTask", { currentStudent, currentResult });
      window.expose.receiveDbData("receiveSaveStudentData", (points) => {
        if (points !== false) {
          document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step);
          currentStudent.points = points;
          updateLines("ביצעת את משימה " + currentResult.name, "כעת יש בחשבונך " + currentStudent.points + " נקודות", "...לא לשכוח לקחת את האישור מהמדפסת");

          if (systemConfig.hasPrint == 1) {
            setTimeout(function () {
              toPrint();
            }, 2000);
          } else {
            setTimeout(function () {
              runPrizeDraw(0);
            }, 2000);
          }
        } else {
          console.error("שגיאה: השמירה במסד הנתונים נכשלה.");
        }
      });

    }



    function toPrint() {
      const dynamicHTML = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8" />
            <title>Print</title>
            <style>
                #title {
                    font-size: 40px;
                    text-align: center;
                }
                #content div {
                    font-size: 17px;
                    margin: 10px 0;
                }
                #footer {
                  font-size: 12px;
                    text-align: center;
                    margin-top: 20px;
                }
            </style>
        </head>
        <body>
            <div id="title">אישור</div>
            <br>
            <div id="content">
                <div>${currentStudent.name}</div>
                <div>${currentStudent.grade}</div>
                <div>${systemConfig.buy == 0
          ? "משימה: " + currentResult.name
          : "זכאות למתנה: " + currentResult.name}</div>
                <div>נקודות בחשבון: ${currentStudent.points}</div>
            </div>
            <br>
            <div id="title">בהצלחה!</div>
            <br>
            <br>
            <div id="footer">להזמנות: אפרת מלכה 0504167969 office@gammick.co.il</div>
        </body>
        </html>
    `;
      printStage = "receipt";
      window.expose.send("sendPrint", dynamicHTML);
    }

    // מאזין אחד לשתי ההדפסות; מאזין נוסף היה נורה גם על הקבלה ומאפס באמצע
    function registerPrintHandler() {
      window.expose.receive("receivePrint", () => {
        if (printStage === "receipt") {
          runPrizeDraw(1800);
        } else {
          reset(PRIZE_AFTER_PRINT_MS);
        }
      });
    }

    // ההגרלה מתבצעת רק אחרי שהתיקוף נשמר והקבלה הודפסה
    function runPrizeDraw(resetDelay) {
      window.expose.sendDbData("sendDrawPrize", currentStudent.id);
      window.expose.receiveDbData("receiveDrawPrize", (prize) => {
        if (!prize) {
          reset(resetDelay);
          return;
        }
        prizeWon = prize;
        showPrizeWin();
      });
    }

    function showPrizeWin() {
      document.getElementById("prizeName").innerText = prizeWon.name;

      const modalEl = document.getElementById("prizeModal");
      // הקנבס מקבל מידות רק אחרי שהפופאפ נפתח בפועל
      modalEl.addEventListener("shown.bs.modal", function () {
        launchConfetti(PRIZE_DISPLAY_MS, "prizeConfetti");
      }, { once: true });
      $('#prizeModal').modal('show');

      if (systemConfig.hasPrint == 1) {
        setTimeout(function () {
          printPrizeVoucher();
        }, PRIZE_PRINT_DELAY_MS);
      } else {
        reset(PRIZE_DISPLAY_MS);
      }
    }

    function printPrizeVoucher() {
      const voucherHTML = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8" />
            <title>Print</title>
            <style>
                #title { font-size: 40px; text-align: center; }
                #content div { font-size: 17px; margin: 10px 0; }
                #footer { font-size: 12px; text-align: center; margin-top: 20px; }
            </style>
        </head>
        <body>
            <div id="title">שובר</div>
            <br>
            <div id="content">
                <div>${currentStudent.name}</div>
                <div>${currentStudent.grade}</div>
                <div>${"זכית ב: " + prizeWon.name}</div>
                <div>יש לגשת לאחראית לקבלת הצ'ופר</div>
            </div>
            <br>
            <div id="title">בהנאה!</div>
            <br>
            <br>
            <div id="footer">להזמנות: אפרת מלכה 0504167969 office@gammick.co.il</div>
        </body>
        </html>
      `;
      printStage = "voucher";
      window.expose.send("sendPrint", voucherHTML);
    }

    function reset(time = 0) {
      setTimeout(function () {
        location.reload();
      }, time);
    }

    function hideGraphsButton() {
      document.getElementById("graphsBtn").style.display = "none";
    }

    function updateLines(line1Text, line2Text, line3Text = "") {
      document.getElementById("line1").innerHTML = line1Text;
      document.getElementById("line2").innerHTML = line2Text;
      document.getElementById("line3").innerHTML = line3Text;
    }

    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $(document).ready(function () {
        $('#modal').modal('show')
      });
      setTimeout(function () {
        $(document).ready(function () {
          $('#modal').modal('hide')
        });
        reset(0)
      }
        , 2500);
    }

  </script>

  <div class="background" id="background">
    <a href="#" class="glass-card graphs-open-btn" id="graphsBtn"
      onclick="login('../main/graphs'); return false;">גרפים</a>
    <div class="text">
      <div id="line1"></div>
      <div id="line2"></div>
      <div id="line3"></div>
      <br><br>
    </div>
    <div id="position">עמדה</div>
  </div>
  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
    <div class="modal fade" id="prizeModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content prize-modal-content">
                <canvas id="prizeConfetti" class="confetti-canvas-inner"></canvas>
                <div class="prize-modal-body">
                    <div class="prize-modal-title">זכית בצ'ופר!!</div>
                    <div class="prize-modal-name" id="prizeName"></div>
                    <div class="prize-modal-sub">כל הכבוד!</div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
