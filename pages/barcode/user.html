<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>תוכנית הברקודים</title>
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/userStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>

  <script>
    var students = ""
    var tasks = ""
    var systemConfig = ""
    var searchVal = ""
    var buffer = "";
    var step
    var currentStudent
    var currentResult
    var tableName
    var confettiAnimationId = null;

    // אבן דרך: כל פעם שהתלמידה חוצה כפולה של 100 נקודות
    const MILESTONE_POINTS = 100;
    const MILESTONE_DISPLAY_MS = 5000;
    const DISPLAY_MS = 2000;

    const Steps = {
      step1: "1",
      step2: "2",
      step3: "3"
    };

    function onLoad() {
      step = Steps.step1;
      updateLines("!...שלום", "יש לתקף את הכרטיס האישי בסורק הברקוד")
      tableName = 'systemConfig'
      window.expose.sendSystem("sendReadSystem", tableName);
      window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
        systemConfig = data
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]

        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step)
        document.querySelector(".text").style.color = getTextColor(systemConfig.textColor);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
      })
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          searchVal = buffer;
          buffer = "";
          if (step == Steps.step1) {
            if (searchVal == '999999999')
              login('../main/manage')
            else if (searchVal == '011429519')
              login('../main/system')
            else if (searchVal == '207594581')
              login('../parentsMeeting/user')
            else
              searchStudent();//בת
          }
          else if (step == Steps.step2) {
            systemConfig.buy == 1 ? searchProduct() : searchTask();
          }
        }
      } else {
        buffer += e.key;
      }
    });

    function searchStudent() {
      step = Steps.step2
      hideGraphsButton();
      window.expose.sendDbData("sendGetStudentById", searchVal);
      window.expose.receiveDbData("receiveGetStudentById", (student) => {
        currentStudent = student

        if (currentStudent == null) {
          showAlert("הברקוד לא מופיע ברשימות. גשו למורה!")
          return;
        }
        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step)
        updateLines(
          "(: שלום  " + currentStudent.name,
          systemConfig.buy == 1 ? "יש לסרוק את ברקוד המתנה" : "יש לסרוק את הברקוד לעדכון משימה",
          "עד כה צברת " + currentStudent.points + " נקודות")
      });
    }

    function searchTask() {
      step = Steps.step3;

      window.expose.sendDbData("sendGetTaskByCode", searchVal);
      window.expose.receiveDbData("receiveGetTaskByCode", (task) => {
        if (!task) {
          showAlert("קוד לא תקין, גשו למורה!");
          return;
        }
        currentResult = task
        if (systemConfig.type === 1) {
          window.expose.sendDbData("sendIsTaskUsed", { currentResult });
          window.expose.receiveDbData("receiveIsTaskUsed", (used) => {
            if (used) {
              showAlert("הי, משימה זו כבר תוקפה!");
              return;
            }
            saveStudentData();
          });
        }

        else {
          if (!currentResult.multiple) {
            window.expose.sendDbData("sendHasStudentDoneSelected", { currentStudent, currentResult });
            window.expose.receiveDbData("receiveHasStudentDoneSelected", (alreadyDone) => {
              if (alreadyDone) {
                showAlert("הי, בחירה זו כבר קיימת בחשבונך!");
                return;
              }
              saveStudentData();
            });
          }
          else {
            saveStudentData();
          }
        }
      });
    }

    // hasStudentDoneSelected בודק לבד ב-studentsProducts כש-buy == 1
    function searchProduct() {
      step = Steps.step3;

      window.expose.sendDbData("sendGetProductByCode", searchVal);
      window.expose.receiveDbData("receiveGetProductByCode", (product) => {
        if (!product) {
          showAlert("קוד לא תקין, גשו למורה!");
          return;
        }
        currentResult = product;

        if (!currentResult.multiple) {
          window.expose.sendDbData("sendHasStudentDoneSelected", { currentStudent, currentResult });
          window.expose.receiveDbData("receiveHasStudentDoneSelected", (alreadyDone) => {
            if (alreadyDone) {
              showAlert("הי, מתנה זו כבר קיימת בחשבונך!");
              return;
            }
            saveStudentProduct();
          });
        }
        else {
          saveStudentProduct();
        }
      });
    }

    // saveStudentProduct בשרת מחזיר false כשאין מספיק נקודות, לפני שנרשם משהו
    function saveStudentProduct() {
      window.expose.sendDbData("sendSaveStudentProduct", { currentStudent, currentResult });
      window.expose.receiveDbData("receiveSaveStudentData", (points) => {
        if (points === false) {
          showAlert("אין לך מספיק נקודות בחשבון!");
          return;
        }
        document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step);
        currentStudent.points = points;
        updateLines(
          "תודה רבה " + currentStudent.name,
          "כעת יש בחשבונך " + currentStudent.points + " נקודות",
          "!בהצלחה");

        if (systemConfig.hasPrint == 1) {
          setTimeout(function () {
            toPrint();
          }, DISPLAY_MS);
        } else {
          reset(DISPLAY_MS);
        }
      });
    }

    async function saveStudentData() {
      window.expose.sendDbData("sendSaveStudentTask", { currentStudent, currentResult });
      window.expose.receiveDbData("receiveSaveStudentData", (points) => {
        if (points !== false) {
          document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step);
          const previousPoints = Number(currentStudent.points) || 0;
          currentStudent.points = points;

          const passedMilestone =
            Math.floor(points / MILESTONE_POINTS) > Math.floor(previousPoints / MILESTONE_POINTS);

          updateLines(
            "!!אשרייך",
            "עד כה צברת " + currentStudent.points + " נקודות לזכותך",
            passedMilestone ? "!!את חכמה! מנצלת הזדמנויות פז" : "!!שיתקבלו תפילותייך לרצון"
          );

          // בלי הארכת ההמתנה המסך היה נטען מחדש לפני שהקונפטי מספיק להיראות
          const displayTime = passedMilestone ? MILESTONE_DISPLAY_MS : DISPLAY_MS;
          if (passedMilestone) {
            document.getElementById("line3").classList.add("milestone-line");
            launchConfetti(displayTime);
          }

          if (systemConfig.hasPrint == 1) {
            setTimeout(function () {
              toPrint();
            }, displayTime);
          } else {
            reset(displayTime);
          }
        } else {
          console.error("שגיאה: השמירה במסד הנתונים נכשלה.");
        }
      });

    }



    function toPrint() {
      const dynamicHTML = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8" />
            <title>Print</title>
            <style>
                #title {
                    font-size: 40px;
                    text-align: center;
                }
                #content div {
                    font-size: 17px;
                    margin: 10px 0;
                }
                #footer {
                  font-size: 12px;
                    text-align: center;
                    margin-top: 20px;
                }
            </style>
        </head>
        <body>
            <div id="title">אישור</div>
            <br>
            <div id="content">
                <div>${currentStudent.name}</div>
                <div>${currentStudent.grade}</div>
                <div>${systemConfig.buy == 0
          ? "משימה: " + currentResult.name
          : "זכאות למתנה: " + currentResult.name}</div>
                <div>נקודות בחשבון: ${currentStudent.points}</div>
            </div>
            <br>
            <div id="title">בהצלחה!</div>
            <br>
            <br>
            <div id="footer">להזמנות: אפרת מלכה 0504167969 office@gammick.co.il</div>
        </body>
        </html>
    `;
      window.expose.send("sendPrint", dynamicHTML);
      window.expose.receive("receivePrint", () => {
        reset(1800);
      });
    }

    function launchConfetti(duration) {
      const canvas = document.getElementById("confettiCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#FFC700', '#FF3D68', '#3D9BFF', '#3DFFA0', '#B14EFF', '#FF8A3D'];
      const particles = [];
      for (let i = 0; i < 160; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.5,
          size: 14 + Math.random() * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: 2 + Math.random() * 3,
          speedX: (Math.random() - 0.5) * 2,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10
        });
      }

      const startTime = performance.now();

      function frame(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rotation += p.rotationSpeed;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        });
        if (now - startTime < duration) {
          confettiAnimationId = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
      confettiAnimationId = requestAnimationFrame(frame);
    }

    function reset(time = 0) {
      setTimeout(function () {
        location.reload();
      }, time);
    }

    function hideGraphsButton() {
      document.getElementById("graphsBtn").style.display = "none";
    }

    function updateLines(line1Text, line2Text, line3Text = "") {
      document.getElementById("line1").innerHTML = line1Text;
      document.getElementById("line2").innerHTML = line2Text;
      document.getElementById("line3").innerHTML = line3Text;
    }

    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $(document).ready(function () {
        $('#modal').modal('show')
      });
      setTimeout(function () {
        $(document).ready(function () {
          $('#modal').modal('hide')
        });
        reset(0)
      }
        , 2500);
    }

  </script>

  <div class="background" id="background">
    <a href="#" class="glass-card graphs-open-btn" id="graphsBtn"
      onclick="login('../main/graphs'); return false;">גרפים</a>
    <div class="text">
      <div id="line1"></div>
      <div id="line2"></div>
      <div id="line3"></div>
      <br><br>
    </div>
    <div id="position">עמדה</div>
  </div>
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
</body>

</html>
