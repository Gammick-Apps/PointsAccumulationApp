<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>הפעלה יומית</title>
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/dailyActivationWheelStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/mediaOverlayStyleSheet.css" rel="stylesheet" />
  <!-- בידרמן: שאלה במקום הכותרות, כפתור הקבלה למעלה משמאל -->
  <style>
    .top-actions { position: fixed; top: 2.5vh; left: 2%; z-index: 50; display: flex; gap: 12px; direction: rtl; }
    .top-actions .action-btn { margin: 0; }
    /* מספר העמדה עובר מתחת לכפתורים */
    #position { top: 10vh; }
    /* גודל הגופן של השאלה נקבע ב-fitQuestion: שאלה ארוכה קטנה עד שהיא נכנסת בגובה הקבוע */
    .header.question-mode #line1 { line-height: 1.3; max-width: 76vw; margin: 0 auto; overflow-wrap: anywhere; }
    .qNav { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; direction: rtl; }
    .qNav .action-btn { margin: 0; }
    .glass-btn.small { padding: 4px 18px; font-size: 1rem; }
    /* אזור קבוע מעל הגלגל: הכפתורים למעלה, והשאלה ממורכזת לגובה בשטח שנשאר עד הגלגל */
    .header.question-mode { top: 2.5vh; height: 25vh; display: flex; flex-direction: column; align-items: center; }
    .header.question-mode #line1 { margin: auto auto 0; }
    .header.question-mode #line2 { margin: 0 auto auto; }
    /* הגלגל יורד ומתקרב לגרף (שירד לתחתית המסך), כדי לפנות מקום לשאלה של עד 3 שורות */
    .stage { top: 27vh; height: 50vh; }
    .bars { bottom: 3vh; }
    /* בזמן סריקה מוצגת רק ההודעה "כל הכבוד ל..." */
    body.scanning .qNav { visibility: hidden; }
  </style>
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../../js/languages.js"></script>

  <script>
    var students = ""
    var systemConfig = ""
    var searchVal = ""
    var buffer = "";
    var studentResult = ""
    var tableName
    // { code, name, points, color, el, order } - code הוא שם הכיתה כמו שהוא בקובץ התלמידות
    var classesPoints = []
    // מספר הנקודות שמתווספות לכיתה בכל תיקוף
    const POINTS_PER_SCAN = 5
    // כל כמה זמן הגלגל עובר לכיתה הבאה כשאין פעילות
    const IDLE_STEP_MS = 1800
    // כמה זמן ההודעה וה-+5 נשארים על המסך אחרי סריקה
    const HOLD_AFTER_SCAN_MS = 3000
    // ברקודי שכבה - כל ברקוד מוסיף נקודות לשתי הכיתות של אותה שכבה
    const gradeBarcodes = {
      "331277925": "כיתה ט'",
      "331277926": "כיתה ט'",
      "331277927": "כיתה י'",
      "331277928": "כיתה י'",
      "331277929": 'כיתה י"א',
      "331277930": 'כיתה י"א',
      "331277931": 'כיתה י"ב',
      "331277932": 'כיתה י"ב'
    };
    // מאגר הצבעים לכיתות חדשות; הצבע נבחר ונשמר ב-SQLite בפעם הראשונה שהכיתה מופיעה
    const colorPool = ['#00e5d0', '#ff9800', '#ff4f9a', '#5dff9d', '#6c7dff', '#c86bff', '#ff5a4f',
      '#18c7b0', '#d7ec47', '#8fb3c9', '#ffb36b', '#ffd54a', '#40b4ff', '#a6e05a', '#ff7a45'];

    function onLoad() {
      tableName = 'systemConfig';
      window.expose.sendSystem("sendReadSystem", tableName);
      window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
        systemConfig = data
        setLanguage(systemConfig.language);
        showIdleTitles();
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]
        document.querySelector(".header").style.color = getTextColor(systemConfig.textColor);
        applyDailyBackground(systemConfig);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
        loadStudents();
        loadQuestions();
      })
      // סרטון שנגמר - עוברים להסרטה הבאה ברצף
      document.getElementById("quizVideo").addEventListener("ended", playNextMedia);
      window.expose.receiveDbData("receiveReadClassPoints", (rows) => {
        if (!rows) return;
        classesPoints = rows.map(row => ({ code: row.grade, name: row.grade, points: row.points, color: row.color }));
        buildWheel();
        if (classesPoints.length > 0) renderBars(classesPoints[0]);
        scheduleIdle();
      });
      // לא מעדכנים כאן את הנקודות שעל המסך: התשובה מה-DB מגיעה לפעמים לפני שהאנימציה
      // מוסיפה את ה-5, ואז הם נספרו פעמיים על המסך (10 במקום 5). המסך מוסיף 5 בעצמו,
      // וה-DB נשמר בנפרד; בטעינה הבאה המסך נטען שוב מה-DB.
      window.expose.receiveDbData("receiveAddClassPoints", (rows) => {
        if (!rows) console.error("saving class points failed");
      });
    }

    // ===== בידרמן: השאלות מקובץ השאלות מוצגות במקום הכותרות, עם מעבר בין שאלות =====
    var questions = [];
    var currentQ = 0;

    function loadQuestions() {
      window.expose.sendDbData("sendGetDataByTable", 'questions');
      window.expose.receiveDbData("receiveGetDataByTablequestions", (data) => {
        questions = Array.isArray(data) ? data.filter(q => q.question) : [];
        document.getElementById("qNav").style.display = questions.length > 1 ? "" : "none";
        if (!busy) showIdleTitles();
      });
    }

    // רשימת מספרים עם פסיקים בלי רווחים (למשל ת"ז) היא "מילה" אחת ארוכה שלא יורדת שורה
    // ונחתכת בצד; מוסיפים אחרי כל פסיק נקודת שבירה בלתי נראית.
    // השאלה מוצגת בדיוק כמו בקובץ - בלי להוסיף "?"
    function formatQuestion(text) {
      const div = document.createElement("div");
      div.textContent = String(text).trim();
      return div.innerHTML.replace(/,/g, ",<wbr>");
    }

    function nextQuestion() {
      if (questions.length === 0) return;
      currentQ = (currentQ + 1) % questions.length;
      if (!busy) showIdleTitles();
    }

    function prevQuestion() {
      if (questions.length === 0) return;
      currentQ = (currentQ - 1 + questions.length) % questions.length;
      if (!busy) showIdleTitles();
    }

    function showIdleTitles() {
      if (questions.length > 0) {
        document.querySelector(".header").classList.add("question-mode");
        setLines(formatQuestion(questions[currentQ].question), '', 'rtl');
        return;
      }
      document.querySelector(".header").classList.remove("question-mode");
      // כותרת שנערכה בממשק הניהול נכתבת בעברית רגילה, ולכן מוצגת מימין לשמאל.
      // טקסטי ברירת המחדל ב-languages.js כתובים עם הפיסוק בהתחלה, ולכן משמאל לימין.
      const custom = systemConfig.dailyTitle || systemConfig.dailySubtitle;
      setLines(
        systemConfig.dailyTitle || (custom ? '' : t('welcomeAll')),
        systemConfig.dailySubtitle || (custom ? '' : t('whoWins')),
        custom ? 'rtl' : 'ltr');
    }

    // נטען אחרי השפה, כי הגרף כותב "נקודות" כבר בציור הראשון
    function loadStudents() {
      tableName = 'students'
      window.expose.sendDbData("sendGetDataByTable", tableName);
      window.expose.receiveDbData("receiveGetDataByTable" + tableName, (data) => {
        if (data != 0) {
          students = data;
          // הכיתות נבנות מחדש מטבלת התלמידות בכל טעינה, הנקודות נשמרות ב-SQLite
          window.expose.sendDbData("sendReadClassPoints", colorPool);
        }
      });
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          searchVal = buffer;
          buffer = "";
          if (searchVal == '999999999')
            login('../main/manage')
          else if (searchVal == '011429519')
            login('../main/system')
          else if (searchVal == '207594581')
            login('../parentsMeeting/user')
          else if (gradeBarcodes[searchVal])
            addPointsToGrade(gradeBarcodes[searchVal]);//ברקוד שכבה
          else
            searchInExcel();//בת
        }
      } else {
        buffer += e.key;
      }
    });

    function searchInExcel() {
      studentResult = "";
      for (var i = 0; i < students.length; i++) {
        if (students[i]["tz"] == searchVal || students[i]["code"] == searchVal) {
          studentResult = students[i];
          break;
        }
      }
      if (studentResult == "") {
        showAlert(t('notFound'));
        return;
      }
      saveData();
    }

    // בידרמן: לפי סוג השאלה שמוצגת כרגע
    // - רגיל (או בלי סוג): כל תלמידה מוסיפה 5 נקודות לכיתה שלה
    // - הסרטה: ברקוד נכון = ההסרטות של השאלה ברצף + 5 נקודות; ברקוד לא נכון = X אדום, בלי נקודות
    function saveData() {
      var grade = studentResult.grade;
      if (!classesPoints.find(c => c.code == grade)) return;
      var message = t('wellDoneStudent', { name: studentResult.name, grade: grade });
      var q = currentQuestion();
      var media = [];
      if (q && isVideoQuestion(q)) {
        var answers = splitList(q.answers);
        var isCorrect = answers.includes(String(searchVal)) ||
          answers.includes(String(studentResult.tz)) || answers.includes(String(studentResult.code));
        if (!isCorrect) {
          enqueue({ wrong: true });
          return;
        }
        media = splitList(q.videos);
      }
      window.expose.sendDbData("sendAddClassPoints", { grades: [grade], points: POINTS_PER_SCAN });
      enqueue({ grades: [grade], message: message, media: media, student: { name: studentResult.name, grade: grade } });
    }

    function currentQuestion() {
      return questions.length > 0 ? questions[currentQ] : null;
    }

    // עמודת type בקובץ השאלות: 1 = הסרטה, 0 (או ריק) = רגיל
    function isVideoQuestion(q) {
      return String(q.type ?? '').trim() === '1';
    }

    function splitList(value) {
      return String(value || '').split(',').map(s => s.trim()).filter(s => s !== '');
    }

    // ברקוד שכבה - מוסיף נקודות לכל הכיתות של אותה שכבה (לדוגמה: כיתה ט'1 וכיתה ט'2)
    function addPointsToGrade(gradePrefix) {
      var grades = classesPoints
        .filter(c => String(c.code).indexOf(gradePrefix) === 0)
        .map(c => c.code);
      if (grades.length === 0) {
        showAlert(t('noClassesForGrade'));
        return;
      }
      window.expose.sendDbData("sendAddClassPoints", { grades: grades, points: POINTS_PER_SCAN });
      var gradeLabel = gradePrefix.replace("כיתה ", "");
      enqueue({ grades: grades, message: t('wellDoneClasses', { grade: gradeLabel }) });
    }

    function setLines(line1Text, line2Text, direction = 'ltr') {
      const l1 = document.getElementById("line1"), l2 = document.getElementById("line2");
      l1.style.opacity = 0; l2.style.opacity = 0;
      setTimeout(() => {
        l1.innerHTML = line1Text; l2.innerHTML = line2Text;
        l1.style.direction = direction; l2.style.direction = direction;
        fitQuestion();
        l1.style.opacity = 1; l2.style.opacity = line2Text ? .85 : 0;
      }, 300);
    }

    // שאלה ארוכה: מתחילים בגופן גדול ומקטינים עד שהטקסט נכנס בגובה של כ-3 שורות,
    // כדי שהשאלה תמיד תוצג במלואה ולא תעלה על הגלגל
    const QUESTION_MAX_FONT_VW = 3.2
    const QUESTION_MIN_FONT_VW = 1.4
    const QUESTION_MAX_HEIGHT_VH = 17
    function fitQuestion() {
      const l1 = document.getElementById("line1");
      if (!document.querySelector(".header").classList.contains("question-mode")) {
        l1.style.fontSize = "";
        return;
      }
      const maxHeight = innerHeight * QUESTION_MAX_HEIGHT_VH / 100;
      let size = QUESTION_MAX_FONT_VW;
      l1.style.fontSize = size + "vw";
      // גם גובה וגם רוחב - טקסט שגולש לצד נחשב לא נכנס
      while ((l1.scrollHeight > maxHeight || l1.scrollWidth > l1.clientWidth) && size > QUESTION_MIN_FONT_VW) {
        size -= 0.1;
        l1.style.fontSize = size.toFixed(1) + "vw";
      }
    }

    // מודאל ולא alert() - חלון מערכת מקפיא את המסך ואת קליטת הברקוד
    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $('#modal').modal('show');
      setTimeout(function () {
        $('#modal').modal('hide');
      }, 2500);
    }

    // ================= גלגל הכיתות ================= //
    var wheelStep, wheelRadius, wheelRotation = 0, focusIndex = 0;
    var busy = false;
    var idleTimer = null;
    const scanQueue = [];
    const wait = ms => new Promise(r => setTimeout(r, ms));

    // סדר תצוגה: לפי נקודות; בשוויון נשמר הסדר הקודם
    function sortedByPoints() {
      return [...classesPoints].sort((a, b) => (b.points - a.points) || ((a.order || 0) - (b.order || 0)));
    }

    function buildWheel() {
      const wheel = document.getElementById('wheel');
      wheel.innerHTML = '';
      const n = classesPoints.length;
      if (n === 0) return;
      wheelStep = 360 / n;
      // רוחב הכרטיס כמו --card-w ב-CSS; רדיוס מינימלי גדול כדי שהגלגל ייפרש לרוחב המסך
      const WHEEL_CARD_W = 260;
      const MIN_RADIUS = 650;
      wheelRadius = n < 3 ? MIN_RADIUS : Math.max(MIN_RADIUS, Math.round((WHEEL_CARD_W + 50) / (2 * Math.tan(Math.PI / n))));
      classesPoints.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.style.setProperty('--c', c.color);
        el.innerHTML = `<div class="name"></div><div class="points"></div><div class="label">${t('points')}</div>`;
        el.querySelector('.name').textContent = c.name;
        el.querySelector('.points').textContent = c.points;
        el.style.transform = `rotateY(${i * wheelStep}deg) translateZ(${wheelRadius}px)`;
        c.el = el;
        wheel.appendChild(el);
      });
      wheelRotation = 0;
      focusIndex = 0;
      wheel.style.transition = 'none';
      wheel.style.transform = `translateZ(${-wheelRadius}px) rotateY(0deg)`;
      refreshRanks();
      applyDepth();
    }

    // בידרמן: אין מקומות/מדליות על הגלגל - המובילות נראות בגרף.
    // שומרים רק את סדר הגרף, כדי שבשוויון כיתה לא "תקפוץ" מעל אחרת
    function refreshRanks() {
      sortedByPoints().forEach((c, i) => { c.order = i; });
    }

    // כרטיסים רחוקים מהמרכז מתעמעמים
    function applyDepth() {
      const n = classesPoints.length;
      classesPoints.forEach((c, i) => {
        let d = Math.abs(i - focusIndex);
        d = Math.min(d, n - d);
        c.el.style.opacity = Math.max(0.12, 1 - d * 0.22);
        c.el.style.filter = d === 0 ? 'none' : `blur(${Math.min(d, 4) * 0.6}px) saturate(${1 - Math.min(d, 4) * 0.15})`;
        c.el.classList.toggle('focus', d === 0);
      });
    }

    // סיבוב לכיתה, תמיד באותו כיוון
    function rotateTo(index, durationMs) {
      const wheel = document.getElementById('wheel');
      const target = -index * wheelStep;
      const forward = ((wheelRotation - target) % 360 + 360) % 360;
      wheelRotation -= forward;
      wheel.style.transition = `transform ${durationMs}ms cubic-bezier(.25,.8,.25,1)`;
      wheel.style.transform = `translateZ(${-wheelRadius}px) rotateY(${wheelRotation}deg)`;
      focusIndex = index;
      setTimeout(applyDepth, durationMs * 0.6);
      return wait(durationMs);
    }

    function countUp(el, from, to, ms) {
      const start = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - start) / ms);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // גרף תחתון - כל הכיתות לפי הדירוג, הכיתה שבמרכז מודגשת
    function renderBars(activeClass) {
      const barsEl = document.getElementById('bars');
      const windowClasses = sortedByPoints();
      const from = 0;
      const max = Math.max(...classesPoints.map(c => c.points), 1);
      // הרבה כיתות - עמודות צרות יותר וטקסט קטן יותר
      barsEl.classList.toggle('dense', windowClasses.length > 14);

      // שימוש חוזר באלמנטים כדי שהגבהים ינועו בצורה חלקה
      while (barsEl.children.length < windowClasses.length) {
        const b = document.createElement('div');
        b.className = 'bar';
        b.innerHTML = '<div class="fill" style="height:0"><div class="val"></div></div><div class="bname"></div>';
        barsEl.appendChild(b);
      }
      [...barsEl.children].forEach((b, i) => {
        const c = windowClasses[i];
        if (!c) { b.style.display = 'none'; return; }
        b.style.display = '';
        b.style.setProperty('--c', c.color);
        b.classList.toggle('active', c === activeClass);
        b.querySelector('.fill').style.height = Math.max(4, (c.points / max) * 85) + '%';
        b.querySelector('.val').textContent = c.points;
        // "כיתה" לא נכנס לעמודה צרה, השם המלא מופיע בכרטיס שבגלגל
        b.querySelector('.bname').textContent = String(c.name).replace(/^כיתה\s*/, '');
      });
    }

    function scheduleIdle() {
      clearTimeout(idleTimer);
      if (classesPoints.length < 2) return;
      idleTimer = setTimeout(async () => {
        if (busy) return;
        const next = (focusIndex + 1) % classesPoints.length;
        await rotateTo(next, 700);
        if (busy) return;
        renderBars(classesPoints[next]);
        scheduleIdle();
      }, IDLE_STEP_MS);
    }

    // סריקות שמגיעות באמצע אנימציה נכנסות לתור, כדי שאף סריקה לא תלך לאיבוד
    // ================= הסרטות ותמונות (שאלות מסוג הסרטה) ================= //
    // בעמודה videos כותבים רק שם, למשל 3: אם יש 3.mp4 הוא מתנגן, ואם אין -
    // מחפשים תמונה 3.jpg / 3.jpeg / 3.png ומציגים אותה IMAGE_SECONDS שניות
    const CORRECT_PATH = "../../resources/dailyActivity/correct/"
    const IMAGE_SECONDS = 20
    const WRONG_MARK_SECONDS = 2.5
    // אחרי בנייה הנתיבים רגישים לאותיות גדולות/קטנות (app.asar), ולכן מנסים את שתיהן
    const VIDEO_EXTENSIONS = ["mp4", "MP4"]
    const IMAGE_EXTENSIONS = ["jpg", "JPG", "jpeg", "JPEG", "png", "PNG"]
    var mediaQueue = []
    var mediaTimer = null
    var mediaDone = null

    // מחזיר Promise שמסתיים כשהרצף נגמר או כשלוחצים על האיקס
    function playMediaSequence(names, student) {
      return new Promise(resolve => {
        mediaDone = resolve;
        const caption = document.getElementById("mediaCaption");
        caption.innerHTML = '<span class="capName"></span><span class="capGrade"></span>';
        caption.querySelector(".capName").textContent = student.name;
        caption.querySelector(".capGrade").textContent = student.grade;
        mediaQueue = names.slice();
        playNextMedia();
      });
    }

    function showWrongMark() {
      return new Promise(resolve => {
        mediaDone = resolve;
        mediaQueue = [];
        document.getElementById("mediaCaption").innerHTML = "";
        stopVideo();
        hideImage();
        document.getElementById("quizVideo").style.display = "none";
        document.getElementById("wrongMark").style.display = "flex";
        document.getElementById("videoWrapper").classList.add("show");
        clearTimeout(mediaTimer);
        mediaTimer = setTimeout(closeVideo, WRONG_MARK_SECONDS * 1000);
      });
    }

    function playNextMedia() {
      if (mediaQueue.length === 0) {
        closeVideo();
        return;
      }
      const name = String(mediaQueue.shift()).replace(/\.(mp4|jpe?g|png)$/i, "");
      stopVideo();
      hideImage();
      document.getElementById("wrongMark").style.display = "none";
      document.getElementById("quizVideo").style.display = "block";
      document.getElementById("videoWrapper").classList.add("show");
      tryVideo(name, 0);
    }

    function tryVideo(name, extIndex) {
      const video = document.getElementById("quizVideo");
      if (extIndex >= VIDEO_EXTENSIONS.length) {
        // אין סרטון בשם הזה - עוברים לחיפוש תמונה
        video.onerror = null;
        video.style.display = "none";
        tryImage(name, 0);
        return;
      }
      video.onerror = () => tryVideo(name, extIndex + 1);
      video.src = CORRECT_PATH + name + "." + VIDEO_EXTENSIONS[extIndex];
      video.load();
      video.play().catch(() => { });
    }

    function tryImage(name, extIndex) {
      if (extIndex >= IMAGE_EXTENSIONS.length) {
        // אין לא סרטון ולא תמונה בשם הזה - מדלגים להבא ברצף
        playNextMedia();
        return;
      }
      const img = document.getElementById("quizImage");
      img.onload = () => {
        img.style.display = "block";
        clearTimeout(mediaTimer);
        mediaTimer = setTimeout(playNextMedia, IMAGE_SECONDS * 1000);
      };
      img.onerror = () => tryImage(name, extIndex + 1);
      img.src = CORRECT_PATH + name + "." + IMAGE_EXTENSIONS[extIndex];
    }

    function hideImage() {
      const img = document.getElementById("quizImage");
      img.onload = null;
      img.onerror = null;
      img.removeAttribute("src");
      img.style.display = "none";
    }

    function stopVideo() {
      const video = document.getElementById("quizVideo");
      // בלי זה ריקון ה-src היה נחשב "סרטון לא נמצא" ומפעיל חיפוש תמונה
      video.onerror = null;
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    // סוגר את החלון (גם מהאיקס) וממשיך לגלגל
    function closeVideo() {
      mediaQueue = [];
      clearTimeout(mediaTimer);
      stopVideo();
      hideImage();
      document.getElementById("mediaCaption").innerHTML = "";
      document.getElementById("wrongMark").style.display = "none";
      document.getElementById("quizVideo").style.display = "block";
      document.getElementById("videoWrapper").classList.remove("show");
      if (mediaDone) {
        const done = mediaDone;
        mediaDone = null;
        done();
      }
    }

    function enqueue(event) {
      scanQueue.push(event);
      if (!busy) runQueue();
    }

    async function runQueue() {
      busy = true;
      clearTimeout(idleTimer);
      while (scanQueue.length) await playScan(scanQueue.shift());
      busy = false;
      showIdleTitles();
      scheduleIdle();
    }

    async function playScan({ grades, message, media, student, wrong }) {
      if (wrong) {
        await showWrongMark();
        return;
      }
      // שאלת הסרטה: קודם ההסרטה, ואחריה ה-+5 על הגלגל
      if (media && media.length > 0) await playMediaSequence(media, student);

      const scanned = classesPoints.filter(c => grades.includes(c.code));
      if (scanned.length === 0) return;
      const main = scanned[0];

      document.body.classList.add('scanning');
      setLines(message, '');
      await rotateTo(classesPoints.indexOf(main), 600);

      scanned.forEach(c => {
        const before = c.points;
        c.points += POINTS_PER_SCAN;
        countUp(c.el.querySelector('.points'), before, c.points, 1100);
      });
      const burst = document.getElementById('burst');
      burst.textContent = '+' + POINTS_PER_SCAN;
      burst.classList.remove('show'); void burst.offsetWidth; burst.classList.add('show');
      sparkles(main.color);

      refreshRanks();
      renderBars(main);

      await wait(HOLD_AFTER_SCAN_MS);

      document.body.classList.remove('scanning');
    }

    // ================= חלקיקים ================= //
    var particles = [];
    var fxCtx;

    function sparkles(color) {
      const cx = innerWidth / 2, cy = innerHeight * 0.46;
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
        particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, size: 2 + Math.random() * 4,
          color: Math.random() < .5 ? color : '#ffd54a', g: .12, shape: 'dot' });
      }
    }

    function fxLoop() {
      const fx = document.getElementById('fx');
      fxCtx.clearRect(0, 0, fx.width, fx.height);
      particles = particles.filter(p => p.life > 0 && p.y < fx.height + 40);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.shape === 'dot' ? 0.018 : 0.004;
        fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
        fxCtx.fillStyle = p.color;
        if (p.shape === 'dot') {
          fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
        } else {
          p.rot += p.vr;
          fxCtx.save(); fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
          fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); fxCtx.restore();
        }
      }
      fxCtx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const fx = document.getElementById('fx');
      fxCtx = fx.getContext('2d');
      const resize = () => { fx.width = innerWidth; fx.height = innerHeight; };
      addEventListener('resize', resize); resize();
      fxLoop();
    });
  </script>

  <div class="background" id="background">
    <div class="stars" id="stars"></div>
    <div class="spotlight"></div>

    <div class="closeBtn">
      <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
    </div>
    <div id="position" data-t="position">עמדה</div>

    <!-- בידרמן: כפתורי המסכים למעלה משמאל -->
    <div class="top-actions">
      <button onclick="login('./graphology'); this.blur();" class="action-btn glass-btn" data-t="graphologyBtn">גרפולוגית</button>
    </div>

    <div class="header">
      <div id="qNav" class="qNav" style="display: none;">
        <button onclick="nextQuestion(); this.blur();" class="action-btn glass-btn small" data-t="nextQuestion">שאלה הבאה</button>
        <button onclick="prevQuestion(); this.blur();" class="action-btn glass-btn small" data-t="prevQuestion">שאלה קודמת</button>
      </div>
      <div id="line1"></div>
      <div id="line2"></div>
    </div>

    <div class="stage">
      <div class="wheel" id="wheel"></div>
    </div>

    <div class="bars" id="bars"></div>
    <!-- בתוך .background כדי שהגלגל והכותרת יוכלו לעלות מעל ההחשכה -->
    <div class="dim"></div>
  </div>

  <!-- חלון ההסרטה / התמונה / ה-X האדום של שאלות מסוג הסרטה -->
  <div id="videoWrapper">
    <button id="videoClose" onclick="closeVideo(); this.blur();" aria-label="סגירה">✕</button>
    <div id="mediaCaption"></div>
    <video id="quizVideo" controls></video>
    <img id="quizImage" alt="" />
    <div id="wrongMark">✗</div>
  </div>

  <div class="burst" id="burst">+5</div>

  <canvas id="fx"></canvas>

  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel" data-t="systemMessage">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
</body>
