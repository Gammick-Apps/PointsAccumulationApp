<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>הפעלה יומית</title>
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/dailyActivationWheelStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../../js/languages.js"></script>

  <script>
    var students = ""
    var systemConfig = ""
    var searchVal = ""
    var buffer = "";
    var studentResult = ""
    var tableName
    // { code, name, points, color, el, order } - code הוא שם הכיתה כמו שהוא בקובץ התלמידות
    var classesPoints = []
    // מספר הנקודות שמתווספות לכיתה בכל תיקוף
    const POINTS_PER_SCAN = 5
    // כל כמה זמן הגלגל עובר לכיתה הבאה כשאין פעילות
    const IDLE_STEP_MS = 1800
    // כמה זמן ההודעה וה-+5 נשארים על המסך אחרי סריקה
    const HOLD_AFTER_SCAN_MS = 3000
    // ברקודי שכבה - כל ברקוד מוסיף נקודות לשתי הכיתות של אותה שכבה
    const gradeBarcodes = {
      "331277925": "כיתה ט'",
      "331277926": "כיתה ט'",
      "331277927": "כיתה י'",
      "331277928": "כיתה י'",
      "331277929": 'כיתה י"א',
      "331277930": 'כיתה י"א',
      "331277931": 'כיתה י"ב',
      "331277932": 'כיתה י"ב'
    };
    // מאגר הצבעים לכיתות חדשות; הצבע נבחר ונשמר ב-SQLite בפעם הראשונה שהכיתה מופיעה
    const colorPool = ['#00e5d0', '#ff9800', '#ff4f9a', '#5dff9d', '#6c7dff', '#c86bff', '#ff5a4f',
      '#18c7b0', '#d7ec47', '#8fb3c9', '#ffb36b', '#ffd54a', '#40b4ff', '#a6e05a', '#ff7a45'];

    function onLoad() {
      tableName = 'systemConfig';
      window.expose.sendSystem("sendReadSystem", tableName);
      window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
        systemConfig = data
        setLanguage(systemConfig.language);
        showIdleTitles();
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]
        document.querySelector(".header").style.color = getTextColor(systemConfig.textColor);
        applyDailyBackground(systemConfig);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
        loadStudents();
      })
      window.expose.receiveDbData("receiveReadClassPoints", (rows) => {
        if (!rows) return;
        classesPoints = rows.map(row => ({ code: row.grade, name: row.grade, points: row.points, color: row.color }));
        buildWheel();
        if (classesPoints.length > 0) renderBars(classesPoints[0]);
        scheduleIdle();
      });
      // הנקודות כבר עודכנו במסך; כאן רק מיישרים מול מה שנשמר בפועל
      // לא מעדכנים כאן את הנקודות שעל המסך: התשובה מה-DB מגיעה לפעמים לפני שהאנימציה
      // מוסיפה את ה-5, ואז הם נספרו פעמיים על המסך (10 במקום 5). המסך מוסיף 5 בעצמו,
      // וה-DB נשמר בנפרד; בטעינה הבאה המסך נטען שוב מה-DB.
      window.expose.receiveDbData("receiveAddClassPoints", (rows) => {
        if (!rows) console.error("saving class points failed");
      });
    }

    function showIdleTitles() {
      // כותרת שנערכה בממשק הניהול נכתבת בעברית רגילה, ולכן מוצגת מימין לשמאל.
      // טקסטי ברירת המחדל ב-languages.js כתובים עם הפיסוק בהתחלה, ולכן משמאל לימין.
      const custom = systemConfig.dailyTitle || systemConfig.dailySubtitle;
      setLines(
        systemConfig.dailyTitle || (custom ? '' : t('welcomeAll')),
        systemConfig.dailySubtitle || (custom ? '' : t('whoWins')),
        custom ? 'rtl' : 'ltr');
    }

    // נטען אחרי השפה, כי הגרף כותב "נקודות" כבר בציור הראשון
    function loadStudents() {
      tableName = 'students'
      window.expose.sendDbData("sendGetDataByTable", tableName);
      window.expose.receiveDbData("receiveGetDataByTable" + tableName, (data) => {
        if (data != 0) {
          students = data;
          // הכיתות נבנות מחדש מטבלת התלמידות בכל טעינה, הנקודות נשמרות ב-SQLite
          window.expose.sendDbData("sendReadClassPoints", colorPool);
        }
      });
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          searchVal = buffer;
          buffer = "";
          if (searchVal == '999999999')
            login('../main/manage')
          else if (searchVal == '011429519')
            login('../main/system')
          else if (searchVal == '207594581')
            login('../parentsMeeting/user')
          else if (gradeBarcodes[searchVal])
            addPointsToGrade(gradeBarcodes[searchVal]);//ברקוד שכבה
          else
            searchInExcel();//בת
        }
      } else {
        buffer += e.key;
      }
    });

    function searchInExcel() {
      studentResult = "";
      for (var i = 0; i < students.length; i++) {
        if (students[i]["tz"] == searchVal || students[i]["code"] == searchVal) {
          studentResult = students[i];
          break;
        }
      }
      if (studentResult == "") {
        showAlert(t('notFound'));
        return;
      }
      saveData();
    }

    function saveData() {
      var grade = studentResult.grade;
      if (!classesPoints.find(c => c.code == grade)) return;
      window.expose.sendDbData("sendAddClassPoints", { grades: [grade], points: POINTS_PER_SCAN });
      enqueue({ grades: [grade], message: t('wellDoneStudent', { name: studentResult.name, grade: grade }) });
    }

    // ברקוד שכבה - מוסיף נקודות לכל הכיתות של אותה שכבה (לדוגמה: כיתה ט'1 וכיתה ט'2)
    function addPointsToGrade(gradePrefix) {
      var grades = classesPoints
        .filter(c => String(c.code).indexOf(gradePrefix) === 0)
        .map(c => c.code);
      if (grades.length === 0) {
        showAlert(t('noClassesForGrade'));
        return;
      }
      window.expose.sendDbData("sendAddClassPoints", { grades: grades, points: POINTS_PER_SCAN });
      var gradeLabel = gradePrefix.replace("כיתה ", "");
      enqueue({ grades: grades, message: t('wellDoneClasses', { grade: gradeLabel }) });
    }

    function setLines(line1Text, line2Text, direction = 'ltr') {
      const l1 = document.getElementById("line1"), l2 = document.getElementById("line2");
      l1.style.opacity = 0; l2.style.opacity = 0;
      setTimeout(() => {
        l1.innerHTML = line1Text; l2.innerHTML = line2Text;
        l1.style.direction = direction; l2.style.direction = direction;
        l1.style.opacity = 1; l2.style.opacity = line2Text ? .85 : 0;
      }, 300);
    }

    // מודאל ולא alert() - חלון מערכת מקפיא את המסך ואת קליטת הברקוד
    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $('#modal').modal('show');
      setTimeout(function () {
        $('#modal').modal('hide');
      }, 2500);
    }

    // ================= גלגל הכיתות ================= //
    var wheelStep, wheelRadius, wheelRotation = 0, focusIndex = 0;
    var busy = false;
    var idleTimer = null;
    const scanQueue = [];
    const wait = ms => new Promise(r => setTimeout(r, ms));

    // סדר תצוגה: לפי נקודות; בשוויון נשמר הסדר הקודם
    function sortedByPoints() {
      return [...classesPoints].sort((a, b) => (b.points - a.points) || ((a.order || 0) - (b.order || 0)));
    }

    function buildWheel() {
      const wheel = document.getElementById('wheel');
      wheel.innerHTML = '';
      const n = classesPoints.length;
      if (n === 0) return;
      wheelStep = 360 / n;
      // רוחב הכרטיס כמו --card-w ב-CSS; רדיוס מינימלי גדול כדי שהגלגל ייפרש לרוחב המסך
      const WHEEL_CARD_W = 260;
      const MIN_RADIUS = 650;
      wheelRadius = n < 3 ? MIN_RADIUS : Math.max(MIN_RADIUS, Math.round((WHEEL_CARD_W + 50) / (2 * Math.tan(Math.PI / n))));
      classesPoints.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.style.setProperty('--c', c.color);
        el.innerHTML = `<div class="name"></div><div class="points"></div><div class="label">${t('points')}</div>`;
        el.querySelector('.name').textContent = c.name;
        el.querySelector('.points').textContent = c.points;
        el.style.transform = `rotateY(${i * wheelStep}deg) translateZ(${wheelRadius}px)`;
        c.el = el;
        wheel.appendChild(el);
      });
      wheelRotation = 0;
      focusIndex = 0;
      wheel.style.transition = 'none';
      wheel.style.transform = `translateZ(${-wheelRadius}px) rotateY(0deg)`;
      refreshRanks();
      applyDepth();
    }

    // בידרמן: אין מקומות/מדליות על הגלגל - המובילות נראות בגרף.
    // שומרים רק את סדר הגרף, כדי שבשוויון כיתה לא "תקפוץ" מעל אחרת
    function refreshRanks() {
      sortedByPoints().forEach((c, i) => { c.order = i; });
    }

    // כרטיסים רחוקים מהמרכז מתעמעמים
    function applyDepth() {
      const n = classesPoints.length;
      classesPoints.forEach((c, i) => {
        let d = Math.abs(i - focusIndex);
        d = Math.min(d, n - d);
        c.el.style.opacity = Math.max(0.12, 1 - d * 0.22);
        c.el.style.filter = d === 0 ? 'none' : `blur(${Math.min(d, 4) * 0.6}px) saturate(${1 - Math.min(d, 4) * 0.15})`;
        c.el.classList.toggle('focus', d === 0);
      });
    }

    // סיבוב לכיתה, תמיד באותו כיוון
    function rotateTo(index, durationMs) {
      const wheel = document.getElementById('wheel');
      const target = -index * wheelStep;
      const forward = ((wheelRotation - target) % 360 + 360) % 360;
      wheelRotation -= forward;
      wheel.style.transition = `transform ${durationMs}ms cubic-bezier(.25,.8,.25,1)`;
      wheel.style.transform = `translateZ(${-wheelRadius}px) rotateY(${wheelRotation}deg)`;
      focusIndex = index;
      setTimeout(applyDepth, durationMs * 0.6);
      return wait(durationMs);
    }

    function countUp(el, from, to, ms) {
      const start = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - start) / ms);
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // גרף תחתון - כל הכיתות לפי הדירוג, הכיתה שבמרכז מודגשת
    function renderBars(activeClass) {
      const barsEl = document.getElementById('bars');
      const windowClasses = sortedByPoints();
      const from = 0;
      const max = Math.max(...classesPoints.map(c => c.points), 1);
      // הרבה כיתות - עמודות צרות יותר וטקסט קטן יותר
      barsEl.classList.toggle('dense', windowClasses.length > 14);

      // שימוש חוזר באלמנטים כדי שהגבהים ינועו בצורה חלקה
      while (barsEl.children.length < windowClasses.length) {
        const b = document.createElement('div');
        b.className = 'bar';
        b.innerHTML = '<div class="fill" style="height:0"><div class="val"></div></div><div class="bname"></div>';
        barsEl.appendChild(b);
      }
      [...barsEl.children].forEach((b, i) => {
        const c = windowClasses[i];
        if (!c) { b.style.display = 'none'; return; }
        b.style.display = '';
        b.style.setProperty('--c', c.color);
        b.classList.toggle('active', c === activeClass);
        b.querySelector('.fill').style.height = Math.max(4, (c.points / max) * 85) + '%';
        b.querySelector('.val').textContent = c.points;
        // "כיתה" לא נכנס לעמודה צרה, השם המלא מופיע בכרטיס שבגלגל
        b.querySelector('.bname').textContent = String(c.name).replace(/^כיתה\s*/, '');
      });
    }

    function scheduleIdle() {
      clearTimeout(idleTimer);
      if (classesPoints.length < 2) return;
      idleTimer = setTimeout(async () => {
        if (busy) return;
        const next = (focusIndex + 1) % classesPoints.length;
        await rotateTo(next, 700);
        if (busy) return;
        renderBars(classesPoints[next]);
        scheduleIdle();
      }, IDLE_STEP_MS);
    }

    // סריקות שמגיעות באמצע אנימציה נכנסות לתור, כדי שאף סריקה לא תלך לאיבוד
    function enqueue(event) {
      scanQueue.push(event);
      if (!busy) runQueue();
    }

    async function runQueue() {
      busy = true;
      clearTimeout(idleTimer);
      while (scanQueue.length) await playScan(scanQueue.shift());
      busy = false;
      showIdleTitles();
      scheduleIdle();
    }

    async function playScan({ grades, message }) {
      const scanned = classesPoints.filter(c => grades.includes(c.code));
      if (scanned.length === 0) return;
      const main = scanned[0];

      document.body.classList.add('scanning');
      setLines(message, '');
      await rotateTo(classesPoints.indexOf(main), 600);

      scanned.forEach(c => {
        const before = c.points;
        c.points += POINTS_PER_SCAN;
        countUp(c.el.querySelector('.points'), before, c.points, 1100);
      });
      const burst = document.getElementById('burst');
      burst.textContent = '+' + POINTS_PER_SCAN;
      burst.classList.remove('show'); void burst.offsetWidth; burst.classList.add('show');
      sparkles(main.color);

      refreshRanks();
      renderBars(main);

      await wait(HOLD_AFTER_SCAN_MS);

      document.body.classList.remove('scanning');
    }

    // ================= חלקיקים ================= //
    var particles = [];
    var fxCtx;

    function sparkles(color) {
      const cx = innerWidth / 2, cy = innerHeight * 0.46;
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
        particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, size: 2 + Math.random() * 4,
          color: Math.random() < .5 ? color : '#ffd54a', g: .12, shape: 'dot' });
      }
    }

    function fxLoop() {
      const fx = document.getElementById('fx');
      fxCtx.clearRect(0, 0, fx.width, fx.height);
      particles = particles.filter(p => p.life > 0 && p.y < fx.height + 40);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.shape === 'dot' ? 0.018 : 0.004;
        fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
        fxCtx.fillStyle = p.color;
        if (p.shape === 'dot') {
          fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fxCtx.fill();
        } else {
          p.rot += p.vr;
          fxCtx.save(); fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
          fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); fxCtx.restore();
        }
      }
      fxCtx.globalAlpha = 1;
      requestAnimationFrame(fxLoop);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const fx = document.getElementById('fx');
      fxCtx = fx.getContext('2d');
      const resize = () => { fx.width = innerWidth; fx.height = innerHeight; };
      addEventListener('resize', resize); resize();
      fxLoop();
    });
  </script>

  <div class="background" id="background">
    <div class="stars" id="stars"></div>
    <div class="spotlight"></div>

    <div class="closeBtn">
      <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
    </div>
    <div id="position" data-t="position">עמדה</div>

    <div class="header">
      <div id="line1"></div>
      <div id="line2"></div>
    </div>

    <div class="stage">
      <div class="wheel" id="wheel"></div>
    </div>

    <div class="bars" id="bars"></div>
    <!-- בתוך .background כדי שהגלגל והכותרת יוכלו לעלות מעל ההחשכה -->
    <div class="dim"></div>

    <div class="bottom-actions d-flex flex-row justify-content-center" style="gap: 24px;">
      <button onclick="login('./graphology'); this.blur();" class="action-btn glass-btn" data-t="graphologyBtn">גרפולוגית</button>
      <button onclick="login('./questions'); this.blur();" class="action-btn glass-btn" data-t="videosBtn">הסרטות</button>
    </div>
  </div>

  <div class="burst" id="burst">+5</div>

  <canvas id="fx"></canvas>

  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel" data-t="systemMessage">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
</body>

</html>
