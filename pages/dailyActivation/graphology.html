<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>הדפסת קבלה</title>
</head>

<!-- בידרמן: במקום מסך הגרפולוגית - כפתור גדול שמדפיס תוכניה אחידה בסגנון קבלה מהחנות -->
<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/dailyActivationWheelStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/graphologyStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../../js/languages.js"></script>

  <script>
    var systemConfig = ""
    var buffer = ""
    var printing = false

    // ===== טקסט התוכניה - מתוך "תוכניה ערכים.docx" =====
    // שעות כתובות כמו במסמך המקורי (סוף – התחלה), כי כך הן נראות נכון בשורה מימין לשמאל
    const PROGRAM = {
      blessing: 'בסיעתא דשמיא',
      store: 'אדם ביקר בע"מ',
      purchaseDate: 'תאריך הקניה: ח\' כסליו תשפ"ז',
      copy: 'נאמן למקור',
      columns: ['ברקוד (שעה)', 'תיאור', 'סכום (אורך)'],
      items: [
        { time: '8:30', title: 'מדייקים בערך...', desc: 'יצאנו לדרך', amount: '30 דקות' },
        { time: '9:00 – 8:30', title: 'אערוך שועי', desc: 'תפילת שחרית', amount: '30 דקות' },
        { time: '1:00 – 10:00', title: 'מוקדש בהערכה', desc: 'לכל אחת ואחת', amount: '180 דקות' },
        { time: '2:00 – 1:00', title: 'תעריכו!', desc: 'תוכנית שווה', amount: '60 דקות' },
        { time: '3:00 – 2:00', title: 'שולחן ערוך', desc: 'ערכים תזונתיים (ולא רק)', amount: '60 דקות' },
        { time: '4:00 – 3:00', title: 'טיפוס ערכי', desc: 'תוכנית מבחוץ "ניצבת"', amount: '60 דקות' },
        { time: '4:00', title: 'ערך צבור', desc: 'מוטענות, יצאנו לדרך', amount: '' }
      ],
      totals: [
        ['סה"כ', 'אינסוף'],
        ['שולם', 'מאת ה\''],
        ['אמצעי תשלום', 'אשרי!']
      ],
      notes: [
        'שימי לב להשתמש בכוחות רק למטרה שלשמם נועדו ובהתאם להוראות ה\'.',
        'אין החלפות בשום הון.'
      ],
      hours: 'פתוח מ: יום הולדתך  עד: נצח נצחים.',
      thanks: 'תודה שקניתם אצלנו!'
    };

    function onLoad() {
      window.expose.sendSystem("sendReadSystem", 'systemConfig');
      window.expose.receiveSystem("receiveReadSystemsystemConfig", (data) => {
        systemConfig = (!data || Object.keys(data).length == 0) ? getDefaultConfig() : data;
        setLanguage(systemConfig.language);
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]
        applyDailyBackground(systemConfig);
        document.querySelector(".graph").style.color = getTextColor(systemConfig.textColor);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
      })

      // נרשם פעם אחת, אחרת כל הדפסה הייתה מוסיפה עוד מאזין
      window.expose.receive("receivePrint", (success) => {
        setStatus(success ? t('programPrinted') : t('printFailed'));
        setTimeout(() => {
          printing = false;
          document.getElementById("printBtn").classList.remove("busy");
          setStatus('');
        }, 3000);
      });
    }

    // ברקודי ניהול בלבד - אין כאן סריקת תלמידות
    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          if (buffer == '011429519')
            login('../main/system')
          else if (buffer == '207594581')
            login('../main/user')
          else if (buffer == '999999999')
            login('./manage')
          buffer = "";
        }
      } else {
        buffer += e.key;
      }
    });

    function printProgram() {
      if (printing) return;
      printing = true;
      document.getElementById("printBtn").classList.add("busy");
      setStatus(t('printingProgram'));
      window.expose.send("sendPrint", buildReceipt());
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // קבלה למדפסת 80 מ"מ, כמה שיותר דומה לקבלה אמיתית:
    // כותרת חנות, פרטי קנייה, טבלת פריטים (שעה | תיאור | אורך), סיכום, ברקוד, תנאים ותודה
    function buildReceipt() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const time = pad(now.getHours()) + ':' + pad(now.getMinutes());
      const number = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());

      const items = PROGRAM.items.map(item => `
        <div class="item">
          <div class="time">${escapeHtml(item.time)}</div>
          <div class="desc"><b>${escapeHtml(item.title)}</b><br>${escapeHtml(item.desc)}</div>
          <div class="amount">${escapeHtml(item.amount)}</div>
        </div>`).join('');

      const totals = PROGRAM.totals.map(([label, value], i) =>
        `<div class="total${i === 0 ? ' grand' : ''}"><span>${escapeHtml(label)}:</span><span>${escapeHtml(value)}</span></div>`).join('');

      const notes = PROGRAM.notes.map(n => `<div>${escapeHtml(n)}</div>`).join('');

      return `<!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8" />
        <title>Print</title>
        <style>
          body { font-size: 13px; color: #000; }
          /* השטח המודפס בפועל צר מ-80 מ"מ; בלי זה הצד השמאלי נחתך */
          .receipt { width: 62mm; }
          .center { text-align: center; }
          .blessing { font-size: 11px; text-align: right; }
          .store { font-size: 26px; font-weight: bold; letter-spacing: 1px; margin-top: 4px; }
          .meta { font-size: 12px; margin-top: 2px; }
          .copy { display: inline-block; border: 1.5px solid #000; padding: 1px 8px; font-size: 12px; font-weight: bold; margin-top: 4px; }
          .sep { border-top: 1.5px dashed #000; margin: 7px 0; }
          .sep.double { border-top: 4px double #000; }
          .item, .head { display: grid; grid-template-columns: 16mm 1fr 13mm; column-gap: 2mm; align-items: start; }
          .head { font-size: 11px; font-weight: bold; padding-bottom: 3px; border-bottom: 1px solid #000; }
          .item { padding: 15px 0; font-size: 13px; border-bottom: 1px dotted #000; }
          .time { font-weight: bold; white-space: nowrap; font-size: 12px; }
          .amount { text-align: left; white-space: nowrap; font-size: 12px; }
          .total { display: flex; justify-content: space-between; font-size: 14px; margin: 3px 0; }
          .total.grand { font-size: 18px; font-weight: bold; }
          .barcode { height: 40px; margin: 10px 6mm 2px;
            background: repeating-linear-gradient(90deg, #000 0 2px, #fff 2px 3px, #000 3px 4px, #fff 4px 7px, #000 7px 10px, #fff 10px 11px); }
          .barNum { font-size: 11px; letter-spacing: 3px; direction: ltr; }
          .notes { font-size: 11px; line-height: 1.4; }
          .hours { font-size: 12px; margin-top: 4px; }
          .thanks { font-size: 17px; font-weight: bold; margin-top: 6px; }
        </style>
      </head>
      <body>
       <div class="receipt">
        <div class="blessing">${escapeHtml(PROGRAM.blessing)}</div>
        <div class="center store">${escapeHtml(PROGRAM.store)}</div>
        <div class="center meta">${escapeHtml(PROGRAM.purchaseDate)}</div>
        <div class="center meta">${t('receiptNumber')}: ${number} &nbsp;|&nbsp; ${t('receiptTime')}: ${time}</div>
        <div class="center"><span class="copy">${escapeHtml(PROGRAM.copy)}</span></div>
        <div class="sep"></div>
        <div class="head"><div>${escapeHtml(PROGRAM.columns[0])}</div><div>${escapeHtml(PROGRAM.columns[1])}</div><div class="amount">${escapeHtml(PROGRAM.columns[2])}</div></div>
        ${items}
        <div class="barcode"></div>
        <div class="center barNum">${number}</div>
        <div class="sep double"></div>
        ${totals}
        <div class="sep"></div>
        <div class="center notes">${notes}</div>
        <div class="center hours">${escapeHtml(PROGRAM.hours)}</div>
        <div class="center thanks">${escapeHtml(PROGRAM.thanks)}</div>
       </div>
      </body>
      </html>`;
    }
  </script>

  <div class="background" id="background">
    <div class="stars" id="stars"></div>
    <div class="spotlight"></div>
    <div class="closeBtn">
      <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
    </div>
    <div id="position" data-t="position">עמדה</div>

    <div class="graph">
      <button id="printBtn" class="printBtn" onclick="printProgram(); this.blur();">
        <span class="printIcon">🧾</span>
        <span data-t="printProgramBtn">הדפסת תוכניה</span>
      </button>
      <div id="status" class="status"></div>
    </div>

    <div class="bottom-actions d-flex flex-row justify-content-center">
      <button onclick="login('./classPoints'); this.blur();" class="action-btn glass-btn" data-t="back">חזרה</button>
    </div>
  </div>
</body>

</html>
