<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title> גרפולוגיה</title>   
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/dailyActivationWheelStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/graphologyStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../../js/languages.js"></script>

  <script>
    var systemConfig = ""
    var searchVal = ""
    var tableName
    var result = "";
    var step
    const Steps = {
      step1: "1",
      step2: "2",
      step3: "3"
    }; 
    

    function onLoad() {
      step = Steps.step1;
      tableName = 'systemConfig'
      window.expose.sendSystem("sendReadSystem", tableName);
      window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
        if (!data || Object.keys(data).length == 0) {
          systemConfig = getDefaultConfig()
        }
        else {
          systemConfig = data
        }
        setLanguage(systemConfig.language);
        updateLines(t('welcomeAllEnd'), t('whatGraphologistWrote'));
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]
        applyDailyBackground(systemConfig);
        document.querySelector(".graph").style.color = getTextColor(systemConfig.textColor);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
      })
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (searchVal.length > 0) {
          if (step == Steps.step1) {
            if (searchVal == '011429519')
              login('../main/system')
            else if (searchVal == '207594581')
              login('../main/user')
            else if (searchVal == '999999999')
              login('./manage')
            else //כיתה או בת
              searchInExcel();
          }
        }
      } else {
        searchVal += e.key;
      }
    });

    function searchInExcel() {
      window.expose.sendDbData("sendGetStudentById", searchVal);
      window.expose.receiveDbData("receiveGetStudentById", (student) => {
        result = student;
        if (result == null) {
          showAlert(t('notFound'))
          return;
        }
        showResult()
      });
    }

    function showResult() {
      step = Steps.step2;
      document.getElementById("idle").style.display = "none";
      document.getElementById("resultName").textContent = result.name;
      document.getElementById("resultGrade").textContent = result.grade;
      revealWords(result.text ? result.text : t('noGraphology'));
      document.getElementById("resultCard").classList.add("show");
      if (result.text) {
        setTimeout(function () {
          toPrint();
        }, 2500);
      }
      else {
        // בלי ניתוח אין הדפסה; בלי זה המסך היה נתקע על ההודעה
        reset(6000);
      }
    }

    function toPrint() {
      const dynamicHTML = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8" />
        <title>Print</title>
        <style>
          #title {
            font-size: 40px;
            text-align: center;
          }
          #content div {
            font-size: 17px;
            margin: 10px 0;
          }
          #footer {
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
          }
        </style>
      </head>
      <body>
        <div id="title"><b>${t('printEspeciallyForYou')}</b></div>
        <br>
        <div id="content">
          <div>${result.name}</div>
          <div>${result.grade}</div>
          <br>
          <div><b>${t('printGraphologyAnalysis')}</b></div>
          <div>${result.text}</div>
        </div>
        <br>
        <div id="footer">${t('printFooter')}</div>
      </body>
      </html>
      `;

      window.expose.send("sendPrint", dynamicHTML);
      window.expose.receive("receivePrint", () => {
        reset(8000);
      });
    }

    // הניתוח נחשף מילה אחרי מילה; כל החשיפה נגמרת תוך 2.5 שניות, לפני ההדפסה
    function revealWords(text) {
      const box = document.getElementById("resultText");
      box.innerHTML = "";
      const words = String(text).split(/(\s+)/);
      const delay = Math.min(60, 2500 / Math.max(1, words.length));
      words.forEach((word, i) => {
        const span = document.createElement("span");
        span.textContent = word;
        span.style.animationDelay = (600 + i * delay) + "ms";
        box.appendChild(span);
      });
    }

    function updateLines(line1Text, line2Text, line3Text = "") {
      if (line1Text != "*")
        document.getElementById("line1").innerHTML = line1Text;
      document.getElementById("line2").innerHTML = line2Text;
      document.getElementById("line3").innerHTML = line3Text;
    }

    function reset(time = 0) {
      setTimeout(function () {
        location.reload();
      }, time);
    }

    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $(document).ready(function () {
        $('#modal').modal('show')
      });
      setTimeout(function () {
        $(document).ready(function () {
          $('#modal').modal('hide')
        });
      }, 2500);
      reset(2500)
    }
  </script>

  <div class="background" id="background">
     <div class="closeBtn">
      <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
    </div>
    <div class="stars" id="stars"></div>
    <div class="spotlight"></div>
    <div id="position" data-t="position">עמדה</div>

    <div class="graph">
      <div id="idle">
        <div id="line1"></div>
        <div id="line2"></div>
        <div id="line3"></div>
        <div class="orb">✍️</div>
      </div>
      <div id="resultCard">
        <div id="resultName"></div>
        <div id="resultGrade"></div>
        <div id="resultText"></div>
      </div>
    </div>

    <div class="bottom-actions d-flex flex-row justify-content-center">
      <button onclick="login('./classPoints'); this.blur();" class="action-btn glass-btn" data-t="back">חזרה</button>
    </div>
  </div>

  <div class="modal fade" style="direction: rtl" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel" data-t="systemMessage">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
</body>

</html>
