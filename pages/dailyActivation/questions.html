<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>הסרטות</title>
</head>

<body onload="onLoad()">
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/dailyActivationWheelStyleSheet.css" rel="stylesheet" />
  <link href="../../styleSheets/dailyActivationVideoStyleSheet.css" rel="stylesheet" />
  <script src="../../js/jquery.min.js"></script>
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="../../js/shared.js"></script>
  <script src="../../js/languages.js"></script>

  <script>
    var systemConfig = ""
    var searchVal = ""
    var buffer = "";
    var questions = ""
    var tableName
    var currentIndex = 0
    var wrongMarkTimer = null

    const correctPath = "../../resources/dailyActivity/correct/"

    function onLoad() {
      tableName = 'systemConfig';
      window.expose.sendSystem("sendReadSystem", tableName);
      window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
        if (!data || Object.keys(data).length == 0) {
          systemConfig = getDefaultConfig()
        }
        else {
          systemConfig = data
        }
        setLanguage(systemConfig.language);
        document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
        document.getElementById("position").style.color = getPosition(systemConfig.color)[1]
        applyDailyBackground(systemConfig);
        document.querySelector(".quiz").style.color = getTextColor(systemConfig.textColor);

        if (systemConfig.numPosition.length > 0) {
          document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
        }
        else {
          document.getElementById("position").style.display = "none";
        }
      })

      tableName = 'questions'
      window.expose.sendDbData("sendGetDataByTable", tableName);
      window.expose.receiveDbData("receiveGetDataByTable" + tableName, (data) => {
        if (Array.isArray(data)) {
          questions = data
          showQuestion()
        }
      })

      // שם התלמידה והכיתה מעל ההסרטה
      window.expose.receiveDbData("receiveGetStudentById", (student) => {
        document.getElementById("mediaCaption").innerHTML = student
          ? '<span class="capName"></span><span class="capGrade"></span>'
          : '';
        if (student) {
          document.querySelector("#mediaCaption .capName").textContent = student.name;
          document.querySelector("#mediaCaption .capGrade").textContent = student.grade;
        }
      });

      // כשההסרטה מסתיימת - סוגרים אותה וחוזרים לשאלה
      document.getElementById("quizVideo").addEventListener("ended", function () {
        closeVideo();
      });
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        if (buffer.length > 0) {
          searchVal = buffer;
          buffer = "";
          if (searchVal == '999999999')
            login('../main/manage')
          else if (searchVal == '011429519')
            login('../main/system')
          else
            handleScan();//בת
        }
      } else {
        buffer += e.key;
      }
    });

    function showQuestion() {
      if (questions == "" || questions.length == 0) {
        showAlert(t('noQuestions'));
        return;
      }
      if (currentIndex >= questions.length) {
        currentIndex = 0;
      }
      closeVideo();
      updateLines(questions[currentIndex].question + "?", t('thinkItsYou'));
      document.getElementById("counter").innerHTML = t('questionOf', { n: currentIndex + 1, total: questions.length });
      restartAnimation(document.getElementById("questionCard"), "enter");
    }

    // מפעיל מחדש אנימציית CSS על אותו אלמנט
    function restartAnimation(el, cls) {
      el.classList.remove("enter", "shake");
      void el.offsetWidth;
      el.classList.add(cls);
    }

    function handleScan() {
      if (questions == "" || questions.length == 0) {
        return;
      }
      var current = questions[currentIndex];
      // תמיכה במספר תשובות נכונות: tz ו-video מופרדים בפסיק ומיושרים לפי סדר
      var correctBarcodes = String(current.answers).split(",").map(b => b.trim());
      var correctVideos = String(current.videos).split(",").map(v => v.trim());
      var matchIndex = correctBarcodes.indexOf(searchVal);
      // אם נסרק ברקוד של אחת התלמידות הנכונות - מנגן ישירות את ההסרטה התואמת; אחרת מציג איקס אדום גדול
      if (matchIndex != -1) {
        document.getElementById("mediaCaption").innerHTML = "";
        window.expose.sendDbData("sendGetStudentById", searchVal);
        playVideo(correctPath + correctVideos[matchIndex] + ".mp4");
      } else {
       showWrongMark();
      }
    }

     // מציג בפופאפ איקס אדום גדול במקום הסרטון השגוי
    function showWrongMark() {
      restartAnimation(document.getElementById("questionCard"), "shake");
      document.getElementById("mediaCaption").innerHTML = "";
      stopVideo();
      document.getElementById("quizVideo").style.display = "none";
      document.getElementById("wrongMark").style.display = "flex";
      document.getElementById("videoWrapper").classList.add("show");
      // סוגר את הפופאפ אוטומטית לאחר 3 שניות
      clearTimeout(wrongMarkTimer);
      wrongMarkTimer = setTimeout(closeVideo, 3000);
    }

    function playVideo(src) {
       document.getElementById("wrongMark").style.display = "none";
      document.getElementById("quizVideo").style.display = "block";
      document.getElementById("videoWrapper").classList.add("show");
      var video = document.getElementById("quizVideo");
      video.src = src;
      video.load();
      video.play();
    }

    // סוגר את פופאפ ההסרטה וחוזר לשאלה
    function closeVideo() {
      document.getElementById("mediaCaption").innerHTML = "";
      clearTimeout(wrongMarkTimer);
      stopVideo();
      document.getElementById("wrongMark").style.display = "none";
      document.getElementById("quizVideo").style.display = "block";
      document.getElementById("videoWrapper").classList.remove("show");
    }

    function stopVideo() {
      var video = document.getElementById("quizVideo");
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = questions.length - 1;
      }
      showQuestion();
    }

    function updateLines(line1Text, line2Text, line3Text = "") {
      document.getElementById("line1").innerHTML = line1Text;
      document.getElementById("line2").innerHTML = line2Text;
      document.getElementById("line3").innerHTML = line3Text;
    }

    function showAlert(message) {
      document.querySelector(".modal-body").innerHTML = message;
      $(document).ready(function () {
        $('#modal').modal('show')
      });
      setTimeout(function () {
        $(document).ready(function () {
          $('#modal').modal('hide')
        });
      }, 2500);
    }
  </script>

  <div class="background" id="background">
    <div class="stars" id="stars"></div>
    <div class="spotlight"></div>
    <div class="closeBtn">
      <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
    </div>
    <div id="position" data-t="position">עמדה</div>

    <div class="quiz">
      <div class="counter" id="counter"></div>
      <div class="questionCard" id="questionCard">
        <div id="line1"></div>
        <div id="line2"></div>
        <div id="line3"></div>
      </div>
    </div>

    <div id="quizButtons" class="bottom-actions d-flex flex-row justify-content-center" style="gap: 24px;">
      <button id="prevBtn" onclick="prevQuestion(); this.blur();" class="action-btn" data-t="prevQuestion">שאלה קודמת</button>
      <button id="nextBtn" onclick="nextQuestion(); this.blur();" class="action-btn" data-t="nextQuestion">שאלה הבאה</button>
      <button onclick="login('./classPoints'); this.blur();" class="action-btn glass-btn" data-t="back">חזרה</button>
    </div>
  </div>

  <!-- פופאפ ההסרטה -->
  <div id="videoWrapper">
    <button id="videoClose" onclick="closeVideo(); this.blur();" aria-label="סגירה">✕</button>
    <div id="mediaCaption"></div>
    <video id="quizVideo" controls></video>
    <div id="wrongMark">✗</div>
  </div>

  <div class="modal fade" style="direction: rtl" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel" data-t="systemMessage">הודעת מערכת</h5>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>
</body>

</html>
