<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>ממשק ניהול</title>
</head>

<body onload="onLoad()">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link href="../../styleSheets/cardManageStyleSheet.css" rel="stylesheet" />
    <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
    <script src="../../js/ag-grid-community.min.js"></script>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../../js/shared.js"></script>

    <script>
        var systemConfig = ""
        var students = "";
        var tableName
        var searchVal = ""
        var currentDate = getTodayDate();
        var swich

        var printSwitch;

        var gridOptions
        var columnDefs = [
            { headerName: "כיתה", field: "grade", editable: true },
            { headerName: "שם", field: "name", editable: true },
            { headerName: "תעודת זהות", field: "tz", editable: true },
            {
                headerName: "קוד", field: "code",
                editable: () => !isFingerprintDevice(),
                cellRenderer: params => isFingerprintDevice()
                    ? (params.data.hasFingerprint ? 'רשום' : 'לא רשום')
                    : params.value
            },
            { headerName: "נקודות", field: "points", editable: true }];

        function isFingerprintDevice() {
            return !!systemConfig && systemConfig.device == "6";
        }

        // טבלאות המשימות והמתנות עברו למסכי "תיקופים" ו"מתנות"
        function onLoad() {
            tableName = 'systemConfig'
            window.expose.sendSystem("sendReadSystem", tableName);
            window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
                systemConfig = data
                document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color)
                document.querySelector(".text").style.color = getTextColor(systemConfig.textColor);

                swich = document.getElementById("swich");
                swich_sec = document.getElementById("swich-sec");
                systemConfig.hasBuy != 1 ?
                    swich_sec.style.display = 'none' :
                    swich.checked = systemConfig.buy;
                printSwitch = document.getElementById("print-switch");
                printSwitch.checked = systemConfig.hasPrint == "1" ? true : false;
                showLabel();
                showPrintLabel();

                // אותם תנאים שבהם הטבלאות הוצגו כאן קודם
                const hasTasks = systemConfig.device != "1" || systemConfig.type == "2" || systemConfig.type == "3";
                document.getElementById("tasksBtn").style.display = hasTasks ? '' : 'none';
                document.getElementById("giftsBtn").style.display = systemConfig.hasBuy == 1 ? '' : 'none';
            });
            tableName = 'students'
            window.expose.sendDbData("sendGetDataByTable", tableName);
            window.expose.receiveDbData("receiveGetDataByTable" + tableName, (data) => {
                if (Array.isArray(data) && data.length > 0) {
                    students = data
                    createStudentsGrid()
                }
            });
        }

        document.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                if (searchVal.length > 0) {
                    if (searchVal == '999999999')
                        login("../main/user")
                    if (searchVal == '011429519')
                        login("../main/system")
                }
            } else {
                searchVal += e.key;
            }
        });


        function createStudentsGrid() {
            gridOptions = {
                columnDefs: columnDefs,
                rowData: students,
                enableRtl: true,
                defaultColDef: {
                    filter: 'agTextColumnFilter',
                    filterParams: {
                        suppressAndOrCondition: true
                    },
                    sortable: true,
                    resizable: true
                },
                onFirstDataRendered: onStudentsFirstRendered,
                onCellEditingStopped: updateStudent
            };
            var gridDiv = document.querySelector('#studentsGrid');
            new agGrid.Grid(gridDiv, gridOptions);
        }

        function onStudentsFirstRendered(params) {
            gridOptions.api.sizeColumnsToFit({
                columnLimits: [{ key: 'points', maxWidth: 100 }, { key: 'grade', maxWidth: 100 }],
            });
        }

        function updateStudent(params) {
            const payload = {
                id: params.data.id,
                field: params.colDef.field,
                value: params.newValue
            };
            window.expose.sendDbData("sendUpdateStudent", JSON.stringify(payload));
            window.expose.receiveDbData("receiveUpdateStudent", () => {});
        }

        function addStudent() {
            window.expose.sendDbData("sendInsertStudent");
            window.expose.receiveDbData("receiveInsertStudent", (data) => {
                if (data === true) {
                    location.reload();
                }
            });
        }

        function exportToExcel(name) {
            var params = {
                fileName: currentDate + ' ' + name,
            };
            gridOptions.api.exportDataAsCsv(params);
        }

        function swichChange() {
            updateBuyStatus()
            showLabel()
        }

        function updateBuyStatus() {
            const previousBuy = systemConfig.buy;
            systemConfig.buy = swich.checked;

            window.expose.sendSystem("sendUpdateSystem", JSON.stringify(systemConfig));
            window.expose.receiveSystem("receiveUpdateSystem", (data) => {
                if (data === false) {
                    alert("שמירת הגדרת מצב קנייה נכשלה");
                    systemConfig.buy = previousBuy;
                    swich.checked = !!previousBuy;
                    showLabel();
                }
            });
        }

        function printChange() {
            updatePrintConfig();
            showPrintLabel();
        }

        function updatePrintConfig() {
            systemConfig.hasPrint = printSwitch.checked ? "1" : "0";
            window.expose.sendSystem("sendUpdateSystem", JSON.stringify(systemConfig));
            window.expose.receiveSystem("receiveUpdateSystem", (data) => { });
        }

        function showLabel() {
            swich.checked ?
                document.querySelector(".form-check-label").innerHTML = 'מצב קנייה פעיל' :
                document.querySelector(".form-check-label").innerHTML = 'מצב צבירת נקודות פעיל';
        }

        function showPrintLabel() {
            printSwitch.checked ?
                document.querySelector(".form-print-label").innerHTML = 'הדפסת קבלה פעילה' :
                document.querySelector(".form-print-label").innerHTML = 'הדפסת קבלה לא פעילה';
        }

    </script>
    <div class="background" id="background">
        <div class="manage-top-btns">
            <a href="#" class="prizes-open-btn" onclick="login('../main/prizes'); return false;">צ'ופרים</a>
            <a href="#" class="prizes-open-btn" id="tasksBtn" style="display: none;" onclick="login('../main/taskValidations'); return false;">משימות</a>
            <a href="#" class="prizes-open-btn" id="giftsBtn" style="display: none;" onclick="login('../main/gifts'); return false;">מתנות</a>
        </div>
        <div class="closeBtn">
            <img onclick="expose.appClose()" src="../../resources/barcode/x-light.svg" />
        </div>
        <div class="text">
            <div id="line1">ברוכים הבאים לממשק ניהול</div>
            <div id="line2">כאן אפשר לצפות, לערוך ולהוריד את הנתונים</div>
            <div class="row h-100">
                <div class="col-12 d-flex flex-column mb-4">
                    <div class="d-flex gap-4">
                        <div class="form-check form-switch mb-2" id="swich-sec">
                            <input class="form-check-input" type="checkbox" role="switch" id="swich"
                                onchange="swichChange()">
                            <label class="form-check-label" for="swich"></label>
                        </div>
                        <div class="form-check form-switch mb-2" id="print-switch-sec">
                            <input class="form-check-input" type="checkbox" role="switch" id="print-switch"
                                onchange="printChange()">
                            <label class="form-print-label" for="print-switch"></label>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <img onclick="exportToExcel('ניקוד תלמידות')"
                            src="../../resources/barcode/download-simple-light.svg" class="cursor-pointer" />
                        <img onclick="addStudent()" src="../../resources/barcode/plus-light.svg"
                            class="cursor-pointer" />
                    </div>
                    <div id="studentsGrid" class="ag-theme-alpine w-100 h-100"></div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
