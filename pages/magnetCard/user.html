<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>צבירת נקודות</title>
</head>

<body onload="onLoad()">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link href="../../styleSheets/cardUserStyleSheet.css" rel="stylesheet" />
    <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
    <script src="../../js/jquery.min.js"></script>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../../js/shared.js"></script>

    <div class="background" id="background">
        <a href="#" class="glass-card graphs-open-btn" id="graphsBtn"
            onclick="login('../main/graphs'); return false;">גרפים</a>
        <div class="text">
            <div id="line1"></div>
            <div id="line2"></div>
            <div id="line3"></div>
            <br>
            <br>
            <div class="row row-cols-md-5 g-3 pb-2 justify-content-md-center" id="cards">
            </div>
        </div>
        <div id="position">עמדה</div>
    </div>
    <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">הודעת מערכת</h5>
                </div>
                <div class="modal-body"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Trivia Test -->
    <div class="modal fade" id="triviaModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
        aria-labelledby="triviaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="header-container">
                        <p id="timer" class="text-start"></p>
                        <p id="testName" class="text-center"></p>
                        <p id="questionProgress" class="text-end"></p>
                    </div>
                    <div id="questionContainer">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var actions = ""
        var systemConfig
        var students = ""
        var tests = ""
        var currentStudent = ""
        var currentResult = "";
        var defaultTask = null;
        var stationClosed = false;
        var searchVal = ""
        var buffer = "";
        var tableName
        var isModalOpen = false;
        var questions
        var step
        var prizeWon = null;
        var printStage = "";

        // משך הצגת הפופאפ כשאין מדפסת, מתי נשלח השובר, וכמה נשאר אחרי שיצא
        const PRIZE_DISPLAY_MS = 4500;
        const PRIZE_PRINT_DELAY_MS = 1200;
        const PRIZE_AFTER_PRINT_MS = 2500;

        const Steps = {
            step1: "1",
            step2: "2",
            step3: "3"
        };

        const questionContainer = document.getElementById('questionContainer');
        const questionProgress = document.getElementById('questionProgress');
        const testNameElement = document.getElementById('testName');
        const timerElement = document.getElementById('timer');
        let currentTable = "";
        let currentTest = null;
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let timer;

        function onLoad() {
            step = Steps.step1;
            tableName = 'systemConfig'
            window.expose.sendSystem("sendReadSystem", tableName);
            window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
                systemConfig = data
                document.getElementById("position").style.backgroundColor = getPosition(systemConfig.color)[0]
                document.getElementById("position").style.color = getPosition(systemConfig.color)[1]
                document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color)
                document.querySelector(".text").style.color = getTextColor(systemConfig.textColor);

                if (systemConfig.numPosition.length > 0) {
                    document.getElementById("position").innerHTML += ' ' + systemConfig.numPosition
                }
                else {
                    document.getElementById("position").style.display = "none";
                }
                registerPrintHandler();
                currentTable = systemConfig.buy ? 'products' : 'tasks';

                // שעת הסגירה נקראת מקובץ ולא מהמסד
                window.expose.receive("receiveReadClosingTime", (closingTime) => {
                    if (isAfterClosingTime(closingTime)) {
                        showClosedScreen();
                        return;
                    }
                    scheduleClosing(closingTime);
                    startStation();
                });
                window.expose.send("sendReadClosingTime");
            });
        }

        // המסך נטען מחדש רק אחרי תיקוף, ולכן בלי טיימר העמדה הייתה נשארת פתוחה
        // עד שמישהי תעביר כרטיס אחרי שעת הסגירה
        function scheduleClosing(closingTime) {
            const parts = String(closingTime).split(':');
            const closesAt = new Date();
            closesAt.setHours(Number(parts[0]), Number(parts[1]), 0, 0);

            const wait = closesAt.getTime() - Date.now();
            if (wait > 0) {
                setTimeout(showClosedScreen, wait);
            }
        }

        // מסך סגירה קבוע: העברת כרטיס לא עושה דבר, אבל קודי הניהול עדיין עובדים
        function showClosedScreen() {
            stationClosed = true;
            document.getElementById("cards").style.display = "none";
            updateLines("העמדה סגורה", "התיקוף להיום הסתיים", "נתראה מחר!")
        }

        function startStation() {
            // משימת ברירת מחדל שייכת לתיקוף בלבד; במצב קנייה הזרימה לא משתנה
            if (!systemConfig.buy) {
                window.expose.receiveDbData("receiveGetDefaultTask", (task) => {
                    if (task) {
                        startDefaultTaskMode(task);
                        return;
                    }
                    startSelectionMode();
                });
                window.expose.sendDbData("sendGetDefaultTask");
                return;
            }

            updateLines("שלום...!", "יש לבחור מתנה לקנייה")
            loadActions();
        }

        function loadActions() {
            window.expose.receiveDbData("receiveGetDataByTable" + currentTable, (data) => {
                if (Array.isArray(data) && data.length > 0) {
                    actions = data;
                    createCards();
                }
            });
            window.expose.sendDbData("sendGetDataByTable", currentTable);
        }

        function startSelectionMode() {
            updateLines(" שלום...! ", "יש לבחור משימה לתיקוף ")
            loadActions();
        }

        // אין בחירה: המשימה טעונה מראש והמסך עומד על שלב ההעברה
        function startDefaultTaskMode(task) {
            defaultTask = task;
            currentResult = task;
            step = Steps.step2;
            document.getElementById("cards").style.display = "none";

            updateLines("ברוכה הבאה!", "המשימה שנבחרה: " + task.name, getReaderText())
        }

        document.addEventListener("keypress", function (e) {
            if (isModalOpen) return;
            document.activeElement.blur();
            if (e.key === "Enter") {
                if (buffer.length > 0) {
                    searchVal = buffer;
                    buffer = "";
                    // קודי הניהול נבדקים לפני השלבים, כי עם משימת ברירת מחדל המסך עולה ישר בשלב 2
                    if (searchVal == '999999999') {
                        login('../main/manage');
                        return;
                    }
                    if (searchVal == '011429519') {
                        login('../main/system');
                        return;
                    }

                    if (stationClosed) {
                        return;
                    }

                    if (step == Steps.step1) {
                        showAlert("יש לבחור לפני התיקוף!");
                        return;
                    }
                    if (step == Steps.step2) {
                        searchStudent();
                    }
                }
            } else {
                buffer += e.key;
            }
        });

        function createCards() {
            const cardContainer = document.getElementById("cards");

            actions.filter(item => item.show).forEach(cardData => {
                const cardColumn = document.createElement("div");
                cardColumn.classList.add("col");

                const cardElement = document.createElement("a");
                cardElement.classList.add("card", "glass-card", "focus-ring", "text-decoration-none", "h-100");
                cardElement.addEventListener("click", function () {
                    selectAction(cardData);
                });
                cardElement.href = '#'

                const cardFooter = document.createElement("div");
                cardFooter.classList.add("card-footer", "h-10");

                const footerSmall = document.createElement("small");
                footerSmall.classList.add("text-body-secondary");
                footerSmall.textContent = cardData.points + ' נקודות'

                const cardBody = document.createElement("div");
                cardBody.classList.add("card-body");

                const cardTitle = document.createElement("h5");
                cardTitle.classList.add("card-title");
                cardTitle.textContent = cardData.name

                cardBody.appendChild(cardTitle);
                cardElement.appendChild(cardBody);
                cardFooter.appendChild(footerSmall)
                cardElement.appendChild(cardFooter);
                cardColumn.appendChild(cardElement);
                cardContainer.appendChild(cardColumn);
            });
        }

        function selectAction(cardData) {
            if (step != Steps.step3) {
                step = Steps.step2;
                hideGraphsButton();

                currentResult = cardData;

                if (systemConfig.buy == 1) {
                    updateLines("בחרת במתנה: " + currentResult.name, "")
                }

                switch (currentResult.type) {
                    case 1: {
                        updateLines("בחרת ב: " + currentResult.name, "")
                        break;
                    }
                    case 2: {
                        updateLines("בחרת ב: " + currentResult.name, "")
                        openTest();
                        return;
                    }
                }
                updateLinesByDevice()
            }
        }

        //-------------tests-------------------//

        function openTest() {
            isModalOpen = true;
            document.getElementById("cards").style.display = "none"
            window.expose.sendDbData("sendGetTestByCode", currentResult.code);
            window.expose.receiveDbData("receiveGetTestByCode", (test) => {
                if (!test || !Array.isArray(test.questions) || test.questions.length == 0) {
                    showAlert("שגיאה בטעינת המבחן");
                    return;
                }
                currentTest = test;
                currentQuestionIndex = 0;
                correctCount = 0;
                testNameElement.innerText = `${currentResult.name}`;
                questions = shuffleArray(currentTest.questions);
                displayQuestion();

                const triviaModal = new bootstrap.Modal(document.getElementById('triviaModal'));
                triviaModal.show();
            });
        }
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
            return array;
        }


        function displayQuestion() {
            const questionData = questions[currentQuestionIndex];
            questionContainer.innerHTML = `
        <div class="mb-3">
          <p><strong>${questionData.question}</strong></p>
          ${questionData.answers.map((answer, i) => `
            <div class="answer-button" onclick="submitAnswer(${i})">${answer}</div>
          `).join('')}
        </div>
      `;
            questionProgress.innerText = `${currentQuestionIndex + 1}/${currentTest.questions.length}`;
            startTimer();
        }

        function startTimer() {
            let timeLeft = systemConfig.timer;
            timerElement.innerText = `זמן שנותר: ${timeLeft} שניות`;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timerElement.innerText = `זמן שנותר: ${timeLeft} שניות`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitAnswer(-1); // Auto move to next question if no answer selected
                }
            }, 1000);
        }

        function submitAnswer(selectedIndex) {
            clearInterval(timer);
            if (selectedIndex === currentTest.questions[currentQuestionIndex].correctIndex) {
                correctCount++;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < currentTest.questions.length) {
                displayQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            isModalOpen = false;
            const score = correctCount * currentResult.points;
            updateLines("הציון שלך: " + score)
            updateLinesByDevice()
            currentResult.points = score;
            const triviaModalEl = document.getElementById('triviaModal');
            const triviaModal = bootstrap.Modal.getInstance(triviaModalEl);
            triviaModal.hide();
        }

        //---------------------------//

        function searchStudent() {
            document.getElementById("cards").style.display = "none";
            step = Steps.step3;

            window.expose.sendDbData("sendGetStudentById", searchVal);
            window.expose.receiveDbData("receiveGetStudentById", (student) => {
                currentStudent = student;
                if (currentStudent == null) {
                    showAlert("הברקוד לא מופיע ברשימות. גשו למורה!");
                    return;
                }
                // ההחלטה לפי multiple נעשית בשרת, כך שלכל העמדות יש הגדרה אחת
                window.expose.sendDbData("sendHasStudentDoneSelected", { currentStudent, currentResult });
                window.expose.receiveDbData("receiveHasStudentDoneSelected", (alreadyDone) => {
                    if (alreadyDone) {
                        const daily = systemConfig.buy == 1
                            ? "הי, כבר קנית את זה היום!"
                            : "הי, כבר תיקפת את זה היום!";
                        showAlert(Number(currentResult.multiple) === 2
                            ? daily
                            : "הי, בחירה זו כבר קיימת בחשבונך!");
                        return;
                    }
                    saveStudentData();
                });
            })
        }

        async function saveStudentData() {
            if (systemConfig.buy == 1) {
                window.expose.sendDbData("sendSaveStudentProduct", { currentStudent, currentResult });
            } else {
                window.expose.sendDbData("sendSaveStudentTask", { currentStudent, currentResult });
            }
            window.expose.receiveDbData("receiveSaveStudentData", (points) => {
                if (points == false) {
                    showAlert(" אין לך מספיק נקודות בחשבון! ");
                    return;
                } else {
                    document.getElementById("background").style.backgroundImage = getBackground(systemConfig.device, systemConfig.color, step);
                    currentStudent.points = points;
                    updateLines("תודה רבה " + currentStudent.name, " כעת יש בחשבונך " + currentStudent.points + " נקודות", "בהצלחה!")

                    if (systemConfig.hasPrint == 1) {
                        setTimeout(function () {
                            toPrint();
                        }, 2000);
                    } else {
                        setTimeout(function () {
                            runPrizeDraw(0);
                        }, 2000);
                    }
                }
            });
        }

        function toPrint() {
            const dynamicHTML = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8" />
            <title>Print</title>
            <style>
                #title {
                    font-size: 40px;
                    text-align: center;
                }
                #content div {
                    font-size: 17px;
                    margin: 10px 0;
                }
                #footer {
                    font-size: 12px;
                    text-align: center;
                    margin-top: 20px;
                }
            </style>
        </head>
        <body>
            <div id="title">אישור</div>
            <br>
            <div id="content">
                <div>${currentStudent.name}</div>
                <div>${currentStudent.grade}</div>
                <div>${systemConfig.buy == 0
                    ? "" + currentResult.name
                    : "זכאות למתנה: " + currentResult.name}</div>
                <div>נקודות בחשבון: ${currentStudent.points}</div>
            </div>
            <br>
            <div id="title">בהצלחה!</div>
            <br>
            <br>
            <div id="footer">להזמנות: אפרת מלכה 0504167969 office@gammick.co.il</div>
        </body>
        </html>
    `;
            printStage = "receipt";
            window.expose.send("sendPrint", dynamicHTML);
        }

        // מאזין אחד לשתי ההדפסות; מאזין נוסף היה נורה גם על הקבלה ומאפס באמצע
        function registerPrintHandler() {
            window.expose.receive("receivePrint", () => {
                if (printStage === "receipt") {
                    runPrizeDraw(0);
                } else {
                    reset(PRIZE_AFTER_PRINT_MS);
                }
            });
        }

        // הגרלה רק בתיקוף משימה; בקניית מתנה אין צ'ופר
        function runPrizeDraw(resetDelay) {
            if (systemConfig.buy == 1) {
                reset(resetDelay);
                return;
            }

            window.expose.sendDbData("sendDrawPrize", currentStudent.id);
            window.expose.receiveDbData("receiveDrawPrize", (prize) => {
                if (!prize) {
                    reset(resetDelay);
                    return;
                }
                prizeWon = prize;
                showPrizeWin();
            });
        }

        function showPrizeWin() {
            document.getElementById("prizeName").innerText = prizeWon.name;

            const modalEl = document.getElementById("prizeModal");
            // הקנבס מקבל מידות רק אחרי שהפופאפ נפתח בפועל
            modalEl.addEventListener("shown.bs.modal", function () {
                launchConfetti(PRIZE_DISPLAY_MS, "prizeConfetti");
            }, { once: true });
            $('#prizeModal').modal('show');

            if (systemConfig.hasPrint == 1) {
                setTimeout(function () {
                    printPrizeVoucher();
                }, PRIZE_PRINT_DELAY_MS);
            } else {
                reset(PRIZE_DISPLAY_MS);
            }
        }

        function printPrizeVoucher() {
            const voucherHTML = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8" />
            <title>Print</title>
            <style>
                #title { font-size: 40px; text-align: center; }
                #content div { font-size: 17px; margin: 10px 0; }
                #footer { font-size: 12px; text-align: center; margin-top: 20px; }
            </style>
        </head>
        <body>
            <div id="title">שובר</div>
            <br>
            <div id="content">
                <div>${currentStudent.name}</div>
                <div>${currentStudent.grade}</div>
                <div>${"זכית ב: " + prizeWon.name}</div>
                <div>יש לגשת לאחראית לקבלת הצ'ופר</div>
            </div>
            <br>
            <div id="title">בהנאה!</div>
            <br>
            <br>
            <div id="footer">להזמנות: אפרת מלכה 0504167969 office@gammick.co.il</div>
        </body>
        </html>
    `;
            printStage = "voucher";
            window.expose.send("sendPrint", voucherHTML);
        }

        function reset(time = 0) {
            setTimeout(function () {
                location.reload();
            }, time);
        }

        function hideGraphsButton() {
            document.getElementById("graphsBtn").style.display = "none";
        }

        function updateLines(line1Text, line2Text, line3Text = "") {
            if (line1Text != "*")
                document.getElementById("line1").innerHTML = line1Text;
            document.getElementById("line2").innerHTML = line2Text;
            document.getElementById("line3").innerHTML = line3Text;
        }

        // מקור אחד לנוסח לפי סוג המכשיר, כדי שלא יתפצל בין המסכים
        function getReaderText() {
            if (systemConfig.device == "2") {
                return "יש להעביר את הכרטיס המגנטי";
            }
            if (systemConfig.device == "4") {
                return "יש לסרוק את הצ'יפ בקורא";
            }
            return "יש לסרוק את הברקוד האישי";
        }

        function updateLinesByDevice() {
            updateLines("*", getReaderText())
        }

        function showAlert(message) {
            document.querySelector(".modal-body").innerHTML = message;
            $(document).ready(function () {
                $('#modal').modal('show')
            });
            setTimeout(function () {
                $(document).ready(function () {
                    $('#modal').modal('hide')
                });
                reset(0)
            }
                , 2500);
        }
    </script>

    <div class="modal fade" id="prizeModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content prize-modal-content">
                <canvas id="prizeConfetti" class="confetti-canvas-inner"></canvas>
                <div class="prize-modal-body">
                    <div class="prize-modal-title">זכית בצ'ופר!!</div>
                    <div class="prize-modal-name" id="prizeName"></div>
                    <div class="prize-modal-sub">כל הכבוד!</div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
