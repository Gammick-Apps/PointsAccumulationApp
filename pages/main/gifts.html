<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>מתנות</title>
</head>

<body onload="onLoad()">
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link href="../../styleSheets/cardManageStyleSheet.css" rel="stylesheet" />
    <link href="../../styleSheets/mainStyleSheet.css" rel="stylesheet" />
    <link href="../../styleSheets/prizesStyleSheet.css" rel="stylesheet" />
    <script src="../../js/ag-grid-community.min.js"></script>
    <script src="../../js/jquery.min.js"></script>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../../js/shared.js"></script>
    <script src="../../js/reportScreen.js"></script>

    <div class="background" id="background">
    <div class="prizes-page">
        <div class="prizes-header">
            <div class="prizes-title">מתנות</div>
            <a href="#" class="glass-card prizes-back-btn" onclick="login('./manage'); return false;">
                <span>&#8592;</span><span>חזרה</span>
            </a>
        </div>

        <div class="prizes-grids report-layout">
            <div class="glass-card prizes-section">
                <div class="prizes-section-head">
                    <div class="prizes-section-title">המתנות</div>
                    <div class="report-filters">
                        <button type="button" class="btn btn-dark" onclick="addItem()">הוספת מתנה</button>
                        <button type="button" class="btn btn-dark" onclick="exportGrid('list')">הורדה לאקסל</button>
                    </div>
                </div>
                <div class="report-hint">סימון ✓ = המתנה מוצגת לקנייה. "הצגה" מציגה משמאל רק את הבנות שקנו אותה</div>
                <div id="listGrid" class="ag-theme-alpine report-grid"></div>
            </div>

            <div class="glass-card prizes-section">
                <div class="prizes-section-head">
                    <div class="prizes-section-title" id="recordsTitle">קניות</div>
                    <button type="button" class="btn btn-dark" onclick="exportGrid('records')">הורדה לאקסל</button>
                </div>
                <div class="report-filters">
                    <input type="text" class="form-control" id="studentFilter" placeholder="חיפוש לפי שם הבת"
                        oninput="applyFilter()">
                    <span class="report-count" id="recordsCount"></span>
                </div>
                <div id="recordsGrid" class="ag-theme-alpine report-grid"></div>
            </div>
        </div>
    </div>
    </div>

    <script>
        function onLoad() {
            initReportScreen({
                listTitle: 'המתנות',
                recordsTitle: 'קניות',
                countHeader: 'כמות שנקנתה',
                countField: 'purchases',
                listSend: 'sendReadGiftsSummary',
                listReceive: 'receiveReadGiftsSummary',
                recordsSend: 'sendReadGiftPurchases',
                recordsReceive: 'receiveReadGiftPurchases',
                updateSend: 'sendUpdateProduct',
                insertSend: 'sendInsertProduct',
                insertReceive: 'receiveInsertProduct',
                recordsKey: 'productId',
                recordsColumns: [
                    { headerName: "שם הבת", field: "studentName", flex: 2 },
                    { headerName: "כיתה", field: "grade", flex: 1 },
                    { headerName: "תעודת זהות", field: "tz", flex: 1 },
                    { headerName: "שם המתנה", field: "productName", flex: 2 }
                ]
            });
        }
    </script>
</body>

</html>
