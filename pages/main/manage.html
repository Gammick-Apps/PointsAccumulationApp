<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>צבירת נקודות</title>
</head>

<body onload="onLoad()">
    <script src="../../js/shared.js"></script>
    <script>
        var systemConfig = ""
        var tableName

        function onLoad() {
            tableName = 'systemConfig'
            window.expose.sendSystem("sendReadSystem", tableName);
            window.expose.receiveSystem("receiveReadSystem" + tableName, (data) => {
                systemConfig = data
                // ברקוד, כרטיס מגנטי וטביעת אצבע חולקים ממשק ניהול אחד
                if (systemConfig.device == 1 || systemConfig.device == 2 || systemConfig.device == 4 || systemConfig.device == 6)
                    login("../magnetCard/manage")
                else if (systemConfig.device == 3)
                    login("../digitalCard/manage")
                else if (systemConfig.device == 5)
                    login("../dailyActivation/manage")
            })
        }
    </script>

</html>
